<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa Electoral · Concertación Carabobo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
/* ══ RESET & TOKENS ══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:      #0a2463;
  --blue-mid:  #1a3a8f;
  --blue-lit:  #2255c8;
  --green:     #1b8a4c;
  --green-lit: #27c06a;
  --white:     #f4f7ff;
  --glass:     rgba(255,255,255,0.07);
  --glass-bd:  rgba(255,255,255,0.15);
  --hdr:       64px;
  --panel-w:   340px;
  --r:         14px;
  --fh:        'Barlow Condensed',sans-serif;
  --fb:        'DM Sans',sans-serif;
}
html,body{height:100%;background:#050d1f;color:var(--white);font-family:var(--fb);overflow:hidden}

/* ══ LOADER ══════════════════════════════════════════════════════ */
#loader{
  position:fixed;inset:0;background:#050d1f;z-index:3000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .6s ease
}
#loader.done{opacity:0;pointer-events:none}
#loader img{height:72px;filter:drop-shadow(0 0 18px rgba(39,192,106,.55))}
.spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--green-lit);border-radius:50%;animation:spin .85s linear infinite}
#loader p{font-family:var(--fh);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.38)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ HEADER ══════════════════════════════════════════════════════ */
#hdr{
  position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:1000;
  background:linear-gradient(90deg,#0a2463 0%,#0d1f55 55%,#0a2a1a 100%);
  border-bottom:1px solid var(--glass-bd);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  box-shadow:0 2px 24px rgba(0,0,0,.65)
}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:44px;filter:drop-shadow(0 0 8px rgba(39,192,106,.4))}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-txt b{font-family:var(--fh);font-weight:900;font-size:1.3rem;letter-spacing:.07em;text-transform:uppercase}
.brand-txt small{font-family:var(--fh);font-weight:300;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green-lit);margin-top:2px}
.hdr-stat{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.hdr-stat .val{font-family:var(--fh);font-weight:700;font-size:1.45rem;color:var(--green-lit);letter-spacing:.04em}
.hdr-stat .lbl{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;opacity:.55}

/* ══ LAYOUT ══════════════════════════════════════════════════════ */
#app{height:100%;padding-top:var(--hdr)}
#map{height:100%;width:100%;background:#050d1f}
.leaflet-control-attribution{display:none!important}

/* ══ LAYER SWITCHER ══════════════════════════════════════════════ */
#layers{
  position:fixed;bottom:26px;right:14px;z-index:900;
  display:flex;flex-direction:column;gap:5px
}
.lbtn{
  display:flex;align-items:center;gap:8px;
  background:rgba(5,15,40,.9);border:1px solid var(--glass-bd);
  border-radius:9px;padding:7px 13px;cursor:pointer;
  font-family:var(--fh);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(244,247,255,.55);transition:all .2s;backdrop-filter:blur(10px);white-space:nowrap
}
.lbtn:hover{background:rgba(20,50,140,.75);color:var(--white)}
.lbtn.on{border-color:var(--green-lit);color:var(--green-lit);background:rgba(27,138,76,.15)}
.lbtn .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ══ SIDE PANEL ══════════════════════════════════════════════════ */
#panel{
  position:fixed;top:var(--hdr);right:calc(-1 * var(--panel-w) - 20px);
  width:var(--panel-w);height:calc(100% - var(--hdr));
  background:linear-gradient(165deg,rgba(10,36,99,.94) 0%,rgba(4,16,45,.98) 100%);
  border-left:1px solid var(--glass-bd);backdrop-filter:blur(20px);z-index:900;
  transition:right .42s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:-8px 0 48px rgba(0,0,0,.55)
}
#panel.open{right:0}

/* close btn */
#pcls{
  position:absolute;top:11px;right:12px;width:32px;height:32px;
  border:1px solid var(--glass-bd);border-radius:50%;background:var(--glass);
  color:var(--white);font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s;z-index:5
}
#pcls:hover{background:rgba(255,255,255,.14);transform:rotate(90deg)}

/* hero */
#phero{
  padding:26px 22px 18px;border-bottom:1px solid var(--glass-bd);
  background:linear-gradient(135deg,rgba(27,138,76,.1) 0%,transparent 60%);
  flex-shrink:0
}
#pflag{
  width:100%;height:108px;object-fit:cover;
  border-radius:10px;margin-bottom:14px;
  box-shadow:0 4px 22px rgba(0,0,0,.55);border:1px solid var(--glass-bd)
}
#pname{font-family:var(--fh);font-weight:900;font-size:1.95rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
#pcap{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green-lit);margin-top:5px;opacity:.85}

/* stats grid */
#pstats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:18px 18px 0}
.sc{
  background:var(--glass);border:1px solid var(--glass-bd);border-radius:var(--r);
  padding:14px 12px;display:flex;flex-direction:column;gap:5px;
  position:relative;overflow:hidden;transition:background .2s
}
.sc::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--green) 0%,var(--blue-lit) 100%);
  opacity:0;transition:opacity .3s
}
.sc:hover{background:rgba(255,255,255,.1)}
.sc:hover::before{opacity:1}
.sc .ico{font-size:1.3rem;line-height:1}
.sc .sv{font-family:var(--fh);font-weight:700;font-size:1.5rem;color:var(--white);letter-spacing:.02em}
.sc .sl{font-size:.62rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(244,247,255,.42)}

/* progress bar */
#pbar-wrap{padding:14px 18px 0;flex-shrink:0}
#pbar-wrap label{font-size:.62rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(244,247,255,.42);display:block;margin-bottom:6px}
#pbar-track{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#pbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--green-lit));transition:width .6s ease}

/* footer */
#pftr{
  margin-top:auto;padding:14px 18px;border-top:1px solid var(--glass-bd);
  display:flex;align-items:center;gap:10px;flex-shrink:0
}
#pftr img{height:36px;filter:drop-shadow(0 0 6px rgba(39,192,106,.35))}
#pftr span{font-family:var(--fh);font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;opacity:.5}

/* ══ TOOLTIP ═════════════════════════════════════════════════════ */
.mtt{
  background:rgba(4,16,45,.94)!important;border:1px solid rgba(39,192,106,.45)!important;
  border-radius:8px!important;color:var(--white)!important;
  font-family:var(--fh)!important;font-weight:700!important;
  font-size:.92rem!important;letter-spacing:.08em!important;text-transform:uppercase!important;
  padding:6px 12px!important;white-space:nowrap!important;
  box-shadow:0 4px 18px rgba(0,0,0,.55),0 0 14px rgba(39,192,106,.12)!important;
  backdrop-filter:blur(8px)!important
}
.leaflet-tooltip-top.mtt::before{border-top-color:rgba(39,192,106,.4)!important}

/* ══ HINT ════════════════════════════════════════════════════════ */
#hint{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:rgba(4,16,45,.88);border:1px solid var(--glass-bd);
  border-radius:30px;padding:7px 20px;
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  opacity:.72;z-index:800;pointer-events:none;transition:opacity .6s;
  backdrop-filter:blur(8px)
}
#hint.gone{opacity:0}

/* ══ RESPONSIVE ══════════════════════════════════════════════════ */
@media(max-width:640px){
  :root{--panel-w:100vw}
  #panel{top:auto;bottom:calc(-65vh - 20px);right:0;height:65vh;
    border-left:none;border-top:1px solid var(--glass-bd);
    border-radius:20px 20px 0 0;
    transition:bottom .42s cubic-bezier(.22,1,.36,1)}
  #panel.open{bottom:0;right:0}
  .brand-txt b{font-size:1.05rem}
  #layers{bottom:12px;right:8px}
  .lbtn{font-size:.7rem;padding:6px 10px}
  #pstats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ── LOADER ───────────────────────────────────────────────────── -->
<div id="loader">
  <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true" alt="logo"/>
  <div class="spinner"></div>
  <p>Cargando mapa electoral de Carabobo…</p>
</div>

<!-- ── HEADER ───────────────────────────────────────────────────── -->
<header id="hdr">
  <div class="brand">
    <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true" alt="Logo"/>
    <div class="brand-txt">
      <b>Concertación Carabobo</b>
      <small>Mapa Electoral Estratégico 2025</small>
    </div>
  </div>
  <div class="hdr-stat">
    <span class="val">1.663.942</span>
    <span class="lbl">Electores · Estado Carabobo</span>
  </div>
</header>

<!-- ── MAP ──────────────────────────────────────────────────────── -->
<div id="app"><div id="map"></div></div>

<!-- ── LAYER SWITCHER ───────────────────────────────────────────── -->
<div id="layers">
  <button class="lbtn on" id="lb-dark"  onclick="setLayer('dark')"><span class="dot"></span>Oscuro</button>
  <button class="lbtn"    id="lb-osm"   onclick="setLayer('osm')"><span class="dot"></span>Mapa</button>
  <button class="lbtn"    id="lb-sat"   onclick="setLayer('sat')"><span class="dot"></span>Satélite</button>
  <button class="lbtn"    id="lb-topo"  onclick="setLayer('topo')"><span class="dot"></span>Topográfico</button>
</div>

<!-- ── SIDE PANEL ───────────────────────────────────────────────── -->
<div id="panel">
  <button id="pcls" title="Cerrar">✕</button>
  <div id="phero">
    <img id="pflag" src="" alt="Bandera"/>
    <div id="pname">—</div>
    <div id="pcap">Capital: —</div>
  </div>
  <div id="pstats">
    <div class="sc"><span class="ico">🗳️</span><span class="sv" id="sv-mesas">—</span><span class="sl">Mesas</span></div>
    <div class="sc"><span class="ico">👥</span><span class="sv" id="sv-elec">—</span><span class="sl">Electores</span></div>
    <div class="sc"><span class="ico">📊</span><span class="sv" id="sv-pct">—</span><span class="sl">% del Estado</span></div>
    <div class="sc"><span class="ico">🏛️</span><span class="sv" id="sv-ratio">—</span><span class="sl">Elec / Mesa</span></div>
  </div>
  <div id="pbar-wrap">
    <label>Peso electoral en el estado</label>
    <div id="pbar-track"><div id="pbar-fill" style="width:0%"></div></div>
  </div>
  <div id="pftr">
    <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true" alt="Logo"/>
    <span>Concertación Carabobo · 2025</span>
  </div>
</div>

<div id="hint">Selecciona un municipio para ver su información</div>

<!-- ── LEAFLET ───────────────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   DATOS DE MUNICIPIOS
══════════════════════════════════════════════════════════════════ */
const DATA = {
  "Valencia":       {capital:"Valencia",      mesas:742,  elec:613670,  lat:10.153985, lng:-67.988735, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Valencia.jpg?raw=true"},
  "Diego Ibarra":   {capital:"Mariara",       mesas:90,   elec:71951,   lat:10.288812, lng:-67.721095, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Diego%20Ibarra.jpg?raw=true"},
  "Carlos Arvelo":  {capital:"Güigüe",        mesas:147,  elec:107312,  lat:10.083036, lng:-67.780881, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/carlos%20arvelo.jpg?raw=true"},
  "Guacara":        {capital:"Guacara",       mesas:153,  elec:131072,  lat:10.263974, lng:-67.890448, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Guacara.jpg?raw=true"},
  "Juan José Mora": {capital:"Morón",         mesas:78,   elec:53965,   lat:10.491015, lng:-68.198705, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Juan%20Jose%20Mora.jpg?raw=true"},
  "Libertador":     {capital:"Tocuyito",      mesas:159,  elec:124901,  lat:10.015869, lng:-68.154266, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Libertador.jpg?raw=true"},
  "Los Guayos":     {capital:"Los Guayos",   mesas:131,  elec:106124,  lat:10.172879, lng:-67.925227, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Los%20Guayos.jpg?raw=true"},
  "Miranda":        {capital:"Miranda",       mesas:31,   elec:22578,   lat:10.149892, lng:-68.401530, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Miranda.jpg?raw=true"},
  "Montalban":      {capital:"Montalbán",     mesas:24,   elec:19238,   lat:10.213548, lng:-68.325858, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Montalban.jpg?raw=true"},
  "Naguanagua":     {capital:"Naguanagua",    mesas:127,  elec:106869,  lat:10.268467, lng:-68.015500, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Naguanagua.jpg?raw=true"},
  "Puerto Cabello": {capital:"Puerto Cabello",mesas:188,  elec:150415,  lat:10.471149, lng:-68.024911, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Puerto%20Cabello.jpg?raw=true"},
  "San Diego":      {capital:"San Diego",     mesas:81,   elec:72497,   lat:10.258939, lng:-67.963485, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/San%20diego.jpg?raw=true"},
  "San Joaquin":    {capital:"San Joaquín",   mesas:56,   elec:45866,   lat:10.259778, lng:-67.801935, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/San%20Joaquin.jpg?raw=true"},
  "Bejuma":         {capital:"Bejuma",        mesas:52,   elec:37484,   lat:10.176950, lng:-68.259151, flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Bejuma.jpg?raw=true"},
};

// Alias para normalización de nombres del GeoJSON
const ALIAS = {
  "montalban":"Montalban","montalbán":"Montalban",
  "san joaquín":"San Joaquin","san joaquin":"San Joaquin",
  "juan josé mora":"Juan José Mora","juan jose mora":"Juan José Mora",
};

const TOTAL = 1663942;

/* ══════════════════════════════════════════════════════════════════
   MAPA
══════════════════════════════════════════════════════════════════ */
const TILES = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}),
  osm:  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19}),
  sat:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:17}),
};

const map = L.map('map',{
  center:[10.22,-68.05],zoom:10,
  zoomControl:true,attributionControl:false,
  layers:[TILES.dark]
});
map.zoomControl.setPosition('topright');

let curTile='dark';
function setLayer(name){
  map.removeLayer(TILES[curTile]);
  map.addLayer(TILES[name]);
  TILES[name].bringToBack();
  if(geoL) geoL.bringToFront();
  curTile=name;
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('lb-'+name).classList.add('on');
}

/* ══════════════════════════════════════════════════════════════════
   ESTILOS VECTORIALES
══════════════════════════════════════════════════════════════════ */
const ST = {
  base:    {color:'#27c06a',weight:1.8,fillColor:'#1a3a8f',fillOpacity:0.55,opacity:1},
  hover:   {color:'#5b9fff',weight:2.8,fillColor:'#2060d8',fillOpacity:0.78,opacity:1},
  sel:     {color:'#27c06a',weight:3,  fillColor:'#1b8a4c',fillOpacity:0.75,opacity:1},
  dim:     {color:'#0d2060',weight:1,  fillColor:'#050f2a',fillOpacity:0.22,opacity:0.35},
};

let selL=null, geoL=null;

/* ══════════════════════════════════════════════════════════════════
   PANEL
══════════════════════════════════════════════════════════════════ */
const panel=document.getElementById('panel');
const hint=document.getElementById('hint');
let hintGone=false;

function n(v){return v.toLocaleString('es-VE')}

function openPanel(key){
  const d=DATA[key]; if(!d) return;
  document.getElementById('pflag').src=d.flag;
  document.getElementById('pname').textContent=key;
  document.getElementById('pcap').textContent='Capital: '+d.capital;
  document.getElementById('sv-mesas').textContent=n(d.mesas);
  document.getElementById('sv-elec').textContent=n(d.elec);
  const pct=((d.elec/TOTAL)*100);
  document.getElementById('sv-pct').textContent=pct.toFixed(1)+'%';
  document.getElementById('sv-ratio').textContent=n(Math.round(d.elec/d.mesas));
  document.getElementById('pbar-fill').style.width=Math.min(pct*3,100)+'%';
  panel.classList.add('open');
  if(!hintGone){hint.classList.add('gone');hintGone=true}
}

function closePanel(){
  panel.classList.remove('open');
  if(geoL) geoL.eachLayer(l=>l.setStyle(ST.base));
  selL=null;
}
document.getElementById('pcls').addEventListener('click',closePanel);

/* ══════════════════════════════════════════════════════════════════
   NORMALIZACIÓN DE NOMBRES
══════════════════════════════════════════════════════════════════ */
function norm(s){
  return (s||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function matchKey(raw){
  if(!raw) return null;
  const lo=norm(raw);
  if(ALIAS[lo]) return ALIAS[lo];
  // exacto
  for(const k of Object.keys(DATA)){if(norm(k)===lo) return k}
  // parcial
  for(const k of Object.keys(DATA)){if(lo.includes(norm(k))||norm(k).includes(lo)) return k}
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   INTERACCIONES DE CAPA
══════════════════════════════════════════════════════════════════ */
function onEach(feature,layer){
  const raw=feature.properties.NAME_2||feature.properties.name||'';
  const key=matchKey(raw)||raw;

  layer.bindTooltip(key,{className:'mtt',sticky:true,offset:[14,0]});

  layer.on('mouseover',function(){
    if(this===selL) return;
    this.setStyle(ST.hover); this.bringToFront();
  });
  layer.on('mouseout',function(){
    if(this===selL) return;
    this.setStyle(selL ? ST.dim : ST.base);
  });
  layer.on('click',function(e){
    L.DomEvent.stopPropagation(e);
    if(selL && selL!==this) selL.setStyle(ST.dim);
    selL=this;
    geoL.eachLayer(l=>{if(l!==selL) l.setStyle(ST.dim)});
    selL.setStyle(ST.sel); selL.bringToFront();
    map.fitBounds(selL.getBounds(),{padding:[60,60],maxZoom:13});
    const mk=matchKey(raw); if(mk) openPanel(mk);
  });
}

/* ══════════════════════════════════════════════════════════════════
   CARGA DEL GEOJSON (filtrado a Carabobo)
══════════════════════════════════════════════════════════════════ */
function buildMap(geojson){
  // Filtrar solo municipios del estado Carabobo
  const feats = geojson.features.filter(f=>{
    const n1=(f.properties.NAME_1||f.properties.adm1||'').toLowerCase();
    return n1.includes('carabobo');
  });

  // Si no hay features de Carabobo (estructura diferente), usar todo
  const collection = {type:'FeatureCollection', features: feats.length ? feats : geojson.features};

  geoL = L.geoJSON(collection,{style:()=>ST.base, onEachFeature:onEach}).addTo(map);
  geoL.bringToFront();
  map.fitBounds(geoL.getBounds(),{padding:[28,28]});

  // Ocultar loader
  setTimeout(()=>{
    const l=document.getElementById('loader');
    l.classList.add('done');
    setTimeout(()=>{if(l.parentNode)l.remove()},700);
  },400);
}

/* Carga desde GitHub raw */
const GEOJSON_URL='https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/20fa810cbe0cf9a47bf6ea735241492e515fd0b6/ven_admin2.json';

fetch(GEOJSON_URL)
  .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json()})
  .then(data=>buildMap(data))
  .catch(err=>{
    console.warn('No se pudo cargar GeoJSON:',err);
    // Fallback: marcadores de posición exacta por municipio
    loadMarkerFallback();
  });

/* ══════════════════════════════════════════════════════════════════
   FALLBACK CON MARCADORES SI EL GEOJSON FALLA
══════════════════════════════════════════════════════════════════ */
function loadMarkerFallback(){
  const bounds=[];
  Object.entries(DATA).forEach(([key,d])=>{
    const marker=L.circleMarker([d.lat,d.lng],{
      radius:Math.max(10, Math.sqrt(d.elec/1000)),
      color:'#27c06a',weight:2,
      fillColor:'#1a3a8f',fillOpacity:0.75
    }).addTo(map);
    marker.bindTooltip(key,{className:'mtt',sticky:true});
    marker.on('click',()=>{
      map.setView([d.lat,d.lng],12);
      openPanel(key);
    });
    bounds.push([d.lat,d.lng]);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[30,30]});

  // Aviso
  const info=L.control({position:'bottomleft'});
  info.onAdd=()=>{
    const d=L.DomUtil.create('div');
    d.innerHTML='<div style="background:rgba(4,16,45,.9);border:1px solid rgba(255,160,0,.4);border-radius:9px;padding:9px 14px;font-family:\'Barlow Condensed\',sans-serif;font-size:.72rem;letter-spacing:.1em;color:rgba(255,200,100,.88);max-width:260px">⚠ GeoJSON no disponible. Asegúrate de que <b>ven_admin2.json</b> esté en la raíz del repo y que GitHub Pages tenga CORS habilitado.</div>';
    return d;
  };
  info.addTo(map);

  const l=document.getElementById('loader');
  l.classList.add('done');
  setTimeout(()=>{if(l.parentNode)l.remove()},700);
}

/* Click en mapa vacío → cerrar panel */
map.on('click',()=>closePanel());
</script>
