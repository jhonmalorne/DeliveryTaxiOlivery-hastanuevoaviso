<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa Electoral · Concertación Carabobo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ─── RESET & TOKENS ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blu:  #0a2463; --blm:  #1a3a8f; --bll: #2255c8;
  --grn:  #1b8a4c; --grl:  #27c06a;
  --wht:  #f4f7ff; --gls:  rgba(255,255,255,.07);
  --glb:  rgba(255,255,255,.14);
  --hh:   64px;    --pw:   348px;   --rr:  14px;
  --fh:   'Barlow Condensed',sans-serif;
  --fb:   'DM Sans',sans-serif;
}
html,body{height:100%;background:#04101e;color:var(--wht);font-family:var(--fb);overflow:hidden}

/* ─── LOADER ─────────────────────────────────────────────────── */
#loader{
  position:fixed;inset:0;background:#04101e;z-index:4000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s
}
#loader.done{opacity:0;pointer-events:none}
#loader img{height:72px;filter:drop-shadow(0 0 20px rgba(39,192,106,.6))}
.spin{width:44px;height:44px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--grl);border-radius:50%;animation:spin .85s linear infinite}
#loader-msg{font-family:var(--fh);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.38)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── HEADER ─────────────────────────────────────────────────── */
#hdr{
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1200;
  background:linear-gradient(90deg,#061730 0%,#0a2052 55%,#061a0f 100%);
  border-bottom:1px solid var(--glb);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  box-shadow:0 2px 28px rgba(0,0,0,.7)
}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:44px;filter:drop-shadow(0 0 10px rgba(39,192,106,.45))}
.brand-txt{line-height:1.1}
.brand-txt b{display:block;font-family:var(--fh);font-weight:900;font-size:1.3rem;letter-spacing:.07em;text-transform:uppercase}
.brand-txt small{font-family:var(--fh);font-weight:300;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--grl);margin-top:2px}
.hdr-stat{text-align:right}
.hdr-stat .v{font-family:var(--fh);font-weight:700;font-size:1.45rem;color:var(--grl);letter-spacing:.04em}
.hdr-stat .l{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;opacity:.5;display:block;margin-top:1px}

/* ─── LAYOUT ─────────────────────────────────────────────────── */
#app{height:100%;padding-top:var(--hh)}
#map{height:100%;width:100%;background:#04101e}
.leaflet-control-attribution{display:none!important}

/* ─── LAYER SWITCHER ─────────────────────────────────────────── */
#lsw{
  position:fixed;bottom:22px;right:12px;z-index:1100;
  display:flex;flex-direction:column;gap:5px
}
.lb{
  display:flex;align-items:center;gap:8px;
  background:rgba(4,14,35,.92);border:1px solid var(--glb);
  border-radius:9px;padding:7px 13px;cursor:pointer;
  font-family:var(--fh);font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(244,247,255,.5);transition:all .2s;backdrop-filter:blur(12px);white-space:nowrap
}
.lb:hover{background:rgba(20,55,150,.75);color:var(--wht)}
.lb.on{border-color:var(--grl);color:var(--grl);background:rgba(27,138,76,.16)}
.lb .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ─── SIDE PANEL ─────────────────────────────────────────────── */
#panel{
  position:fixed;top:var(--hh);right:calc(-1 * var(--pw) - 24px);
  width:var(--pw);height:calc(100% - var(--hh));
  background:linear-gradient(168deg,rgba(9,30,82,.96) 0%,rgba(3,12,36,.99) 100%);
  border-left:1px solid var(--glb);backdrop-filter:blur(22px);z-index:1100;
  transition:right .44s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:-8px 0 52px rgba(0,0,0,.6)
}
#panel.open{right:0}

/* cerrar */
#pcls{
  position:absolute;top:11px;right:11px;width:30px;height:30px;
  border:1px solid var(--glb);border-radius:50%;background:var(--gls);
  color:var(--wht);font-size:.95rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .25s;z-index:5
}
#pcls:hover{background:rgba(255,255,255,.14);transform:rotate(90deg)}

/* hero */
#phero{
  flex-shrink:0;padding:24px 20px 16px;border-bottom:1px solid var(--glb);
  background:linear-gradient(140deg,rgba(27,138,76,.1) 0%,transparent 55%)
}
#pflag{width:100%;height:104px;object-fit:cover;border-radius:10px;
  margin-bottom:14px;box-shadow:0 4px 22px rgba(0,0,0,.6);border:1px solid var(--glb)}
#pname{font-family:var(--fh);font-weight:900;font-size:1.9rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
#pcap{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--grl);margin-top:4px;opacity:.85}

/* stats */
#pstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 16px 0;flex-shrink:0}
.sc{
  background:var(--gls);border:1px solid var(--glb);border-radius:var(--rr);
  padding:13px 11px;display:flex;flex-direction:column;gap:4px;
  position:relative;overflow:hidden;transition:background .2s
}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--grn),var(--bll));opacity:0;transition:opacity .3s}
.sc:hover{background:rgba(255,255,255,.1)}
.sc:hover::before{opacity:1}
.sc .ico{font-size:1.25rem}
.sc .sv{font-family:var(--fh);font-weight:700;font-size:1.45rem;letter-spacing:.02em}
.sc .sl{font-size:.6rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(244,247,255,.4)}

/* barra peso */
#pbar-wrap{flex-shrink:0;padding:12px 16px 0}
#pbar-wrap label{font-size:.6rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(244,247,255,.38);display:block;margin-bottom:5px}
#pbar-track{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#pbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--grn),var(--grl));transition:width .65s ease}

/* parroquias */
#ppar-wrap{flex:1;overflow-y:auto;padding:12px 16px;scrollbar-width:thin;scrollbar-color:var(--glb) transparent}
#ppar-wrap::-webkit-scrollbar{width:4px}
#ppar-wrap::-webkit-scrollbar-thumb{background:var(--glb);border-radius:2px}
#ppar-title{font-family:var(--fh);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,247,255,.38);margin-bottom:8px}
#ppar-list{display:flex;flex-direction:column;gap:4px}
.par-item{
  display:flex;align-items:center;gap:9px;
  background:var(--gls);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:8px 11px;
  font-size:.8rem;font-weight:500;
  transition:background .18s,border-color .18s
}
.par-item:hover{background:rgba(39,192,106,.08);border-color:rgba(39,192,106,.25)}
.par-item .pi{width:7px;height:7px;border-radius:50%;background:var(--grl);flex-shrink:0}

/* footer */
#pftr{
  flex-shrink:0;padding:12px 16px;border-top:1px solid var(--glb);
  display:flex;align-items:center;gap:10px
}
#pftr img{height:34px;filter:drop-shadow(0 0 6px rgba(39,192,106,.35))}
#pftr span{font-family:var(--fh);font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;opacity:.45}

/* ─── TOOLTIP ────────────────────────────────────────────────── */
.mtt{
  background:rgba(3,12,36,.95)!important;border:1px solid rgba(39,192,106,.45)!important;
  border-radius:8px!important;color:var(--wht)!important;
  font-family:var(--fh)!important;font-weight:700!important;
  font-size:.9rem!important;letter-spacing:.08em!important;text-transform:uppercase!important;
  padding:5px 11px!important;white-space:nowrap!important;
  box-shadow:0 4px 18px rgba(0,0,0,.55),0 0 14px rgba(39,192,106,.1)!important;
  backdrop-filter:blur(8px)!important
}
.leaflet-tooltip-top.mtt::before{border-top-color:rgba(39,192,106,.4)!important}
.mtt-par{
  background:rgba(3,12,36,.88)!important;border:1px solid rgba(90,130,255,.35)!important;
  border-radius:7px!important;color:rgba(200,220,255,.85)!important;
  font-family:var(--fb)!important;font-size:.72rem!important;font-weight:500!important;
  padding:4px 10px!important;white-space:nowrap!important;
  backdrop-filter:blur(6px)!important
}

/* ─── HINT ───────────────────────────────────────────────────── */
#hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(3,12,36,.9);border:1px solid var(--glb);
  border-radius:30px;padding:7px 20px;
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  opacity:.72;z-index:900;pointer-events:none;transition:opacity .6s;
  backdrop-filter:blur(8px)
}
#hint.gone{opacity:0}

/* ─── RESPONSIVE ─────────────────────────────────────────────── */
@media(max-width:640px){
  :root{--pw:100vw}
  #panel{top:auto;bottom:calc(-68vh - 20px);right:0;height:68vh;
    border-left:none;border-top:1px solid var(--glb);
    border-radius:20px 20px 0 0;
    transition:bottom .44s cubic-bezier(.22,1,.36,1)}
  #panel.open{bottom:0}
  .brand-txt b{font-size:1.05rem}
  #lsw{bottom:10px;right:6px}
}
</style>
</head>
<body>

<!-- ── LOADER ───────────────────────────────────────────────── -->
<div id="loader">
  <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true" alt="logo"/>
  <div class="spin"></div>
  <p id="loader-msg">Cargando capas electorales…</p>
</div>

<!-- ── HEADER ───────────────────────────────────────────────── -->
<header id="hdr">
  <div class="brand">
    <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true" alt="Logo"/>
    <div class="brand-txt">
      <b>Concertación Carabobo</b>
      <small>Mapa Electoral Estratégico 2025</small>
    </div>
  </div>
  <div class="hdr-stat">
    <span class="v">1.663.942</span>
    <span class="l">Electores · Estado Carabobo</span>
  </div>
</header>

<!-- ── MAP ──────────────────────────────────────────────────── -->
<div id="app"><div id="map"></div></div>

<!-- ── LAYER SWITCHER ───────────────────────────────────────── -->
<div id="lsw">
  <button class="lb on" id="lb-dark" onclick="setTile('dark')"><span class="dot"></span>Oscuro</button>
  <button class="lb"    id="lb-osm"  onclick="setTile('osm')"><span class="dot"></span>Mapa</button>
  <button class="lb"    id="lb-sat"  onclick="setTile('sat')"><span class="dot"></span>Satélite</button>
  <button class="lb"    id="lb-topo" onclick="setTile('topo')"><span class="dot"></span>Topográfico</button>
</div>

<!-- ── SIDE PANEL ───────────────────────────────────────────── -->
<div id="panel">
  <button id="pcls" title="Cerrar">✕</button>

  <div id="phero">
    <img id="pflag" src="" alt="Bandera"/>
    <div id="pname">—</div>
    <div id="pcap">Capital: —</div>
  </div>

  <div id="pstats">
    <div class="sc"><span class="ico">🗳️</span><span class="sv" id="sv-m">—</span><span class="sl">Mesas</span></div>
    <div class="sc"><span class="ico">👥</span><span class="sv" id="sv-e">—</span><span class="sl">Electores</span></div>
    <div class="sc"><span class="ico">📊</span><span class="sv" id="sv-p">—</span><span class="sl">% del Estado</span></div>
    <div class="sc"><span class="ico">🏛️</span><span class="sv" id="sv-r">—</span><span class="sl">Elec/Mesa</span></div>
  </div>

  <div id="pbar-wrap">
    <label>Peso electoral en Carabobo</label>
    <div id="pbar-track"><div id="pbar-fill" style="width:0%"></div></div>
  </div>

  <div id="ppar-wrap">
    <div id="ppar-title">Parroquias del municipio</div>
    <div id="ppar-list"></div>
  </div>

  <div id="pftr">
    <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true" alt="Logo"/>
    <span>Concertación Carabobo · 2025</span>
  </div>
</div>

<div id="hint">Selecciona un municipio para ver su información</div>

<!-- ── LEAFLET ───────────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   DATOS COMPLETOS POR MUNICIPIO (+ parroquias)
══════════════════════════════════════════════════════════════════ */
const DATA = {
  "Valencia": {
    capital:"Valencia", mesas:742, elec:613670,
    lat:10.153985, lng:-67.988735,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Valencia.jpg?raw=true",
    parroquias:["Candelaria","Catedral","El Socorro","Miguel Peña","Rafael Urdaneta","San Blas","San José","Santa Rosa","Negro Primero"]
  },
  "Diego Ibarra": {
    capital:"Mariara", mesas:90, elec:71951,
    lat:10.288812, lng:-67.721095,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Diego%20Ibarra.jpg?raw=true",
    parroquias:["Mariara","Aguas Calientes"]
  },
  "Carlos Arvelo": {
    capital:"Güigüe", mesas:147, elec:107312,
    lat:10.083036, lng:-67.780881,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/carlos%20arvelo.jpg?raw=true",
    parroquias:["Güigüe","Belén","Tacarigua"]
  },
  "Guacara": {
    capital:"Guacara", mesas:153, elec:131072,
    lat:10.263974, lng:-67.890448,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Guacara.jpg?raw=true",
    parroquias:["Guacara","Ciudad Alianza","Yagua"]
  },
  "Juan José Mora": {
    capital:"Morón", mesas:78, elec:53965,
    lat:10.491015, lng:-68.198705,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Juan%20Jose%20Mora.jpg?raw=true",
    parroquias:["Morón","Urama"]
  },
  "Libertador": {
    capital:"Tocuyito", mesas:159, elec:124901,
    lat:10.015869, lng:-68.154266,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Libertador.jpg?raw=true",
    parroquias:["Tocuyito","Independencia"]
  },
  "Los Guayos": {
    capital:"Los Guayos", mesas:131, elec:106124,
    lat:10.172879, lng:-67.925227,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Los%20Guayos.jpg?raw=true",
    parroquias:["Los Guayos"]
  },
  "Miranda": {
    capital:"Miranda", mesas:31, elec:22578,
    lat:10.149892, lng:-68.401530,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Miranda.jpg?raw=true",
    parroquias:["Miranda"]
  },
  "Montalban": {
    capital:"Montalbán", mesas:24, elec:19238,
    lat:10.213548, lng:-68.325858,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Montalban.jpg?raw=true",
    parroquias:["Montalbán"]
  },
  "Naguanagua": {
    capital:"Naguanagua", mesas:127, elec:106869,
    lat:10.268467, lng:-68.015500,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Naguanagua.jpg?raw=true",
    parroquias:["Naguanagua"]
  },
  "Puerto Cabello": {
    capital:"Puerto Cabello", mesas:188, elec:150415,
    lat:10.471149, lng:-68.024911,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Puerto%20Cabello.jpg?raw=true",
    parroquias:["Bartolomé Salom","Democracia","Fraternidad","Goaigoaza","Juan José Flores","Unión","Borburata","Patanemo"]
  },
  "San Diego": {
    capital:"San Diego", mesas:81, elec:72497,
    lat:10.258939, lng:-67.963485,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/San%20diego.jpg?raw=true",
    parroquias:["San Diego"]
  },
  "San Joaquin": {
    capital:"San Joaquín", mesas:56, elec:45866,
    lat:10.259778, lng:-67.801935,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/San%20Joaquin.jpg?raw=true",
    parroquias:["San Joaquín"]
  },
  "Bejuma": {
    capital:"Bejuma", mesas:52, elec:37484,
    lat:10.176950, lng:-68.259151,
    flag:"https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Bejuma.jpg?raw=true",
    parroquias:["Simón Bolívar","Canoabo","Bejuma"]
  },
};

// Alias de normalización
const ALIAS = {
  "montalban":"Montalban","montalbán":"Montalban",
  "san joaquín":"San Joaquin","san joaquin":"San Joaquin",
  "juan josé mora":"Juan José Mora","juan jose mora":"Juan José Mora",
};

const TOTAL = 1663942;

/* ══════════════════════════════════════════════════════════════════
   TILES / CAPAS BASE
══════════════════════════════════════════════════════════════════ */
const TILES = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}),
  osm:  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19}),
  sat:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:17}),
};

const map = L.map('map',{center:[10.22,-68.05],zoom:10,zoomControl:true,attributionControl:false,layers:[TILES.dark]});
map.zoomControl.setPosition('topright');

let curTile='dark';
function setTile(name){
  map.removeLayer(TILES[curTile]);
  map.addLayer(TILES[name]);
  TILES[name].bringToBack();
  [munLayer,parLayer].forEach(l=>{if(l) l.bringToFront()});
  curTile=name;
  document.querySelectorAll('.lb').forEach(b=>b.classList.remove('on'));
  document.getElementById('lb-'+name).classList.add('on');
}

/* ══════════════════════════════════════════════════════════════════
   ESTILOS VECTORIALES
══════════════════════════════════════════════════════════════════ */
const ST = {
  mun_base: {color:'#27c06a',weight:2,fillColor:'#1a3a8f',fillOpacity:0.52,opacity:1},
  mun_hov:  {color:'#5b9fff',weight:3,  fillColor:'#2060d8',fillOpacity:0.78,opacity:1},
  mun_sel:  {color:'#27c06a',weight:3.5,fillColor:'#1b8a4c',fillOpacity:0.72,opacity:1},
  mun_dim:  {color:'#0d2060',weight:1,  fillColor:'#040e28',fillOpacity:0.2, opacity:0.3},
  par_base: {color:'rgba(100,160,255,0.0)',weight:0,fillColor:'transparent',fillOpacity:0},
  par_sel:  {color:'#5b9fff',weight:1.5,fillColor:'rgba(80,160,255,0.18)',fillOpacity:1,opacity:0.9,dashArray:'4 4'},
};

let selMun=null, munLayer=null, parLayer=null, curMunKey=null;

/* ══════════════════════════════════════════════════════════════════
   NORMALIZACIÓN
══════════════════════════════════════════════════════════════════ */
function norm(s){return(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

function matchKey(raw){
  if(!raw) return null;
  const lo=norm(raw);
  if(ALIAS[lo]) return ALIAS[lo];
  for(const k of Object.keys(DATA)){if(norm(k)===lo) return k}
  for(const k of Object.keys(DATA)){if(lo.includes(norm(k))||norm(k).includes(lo)) return k}
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   PANEL LATERAL
══════════════════════════════════════════════════════════════════ */
const panel=document.getElementById('panel');
const hint=document.getElementById('hint');
let hintGone=false;

function n(v){return v.toLocaleString('es-VE')}

function openPanel(key){
  const d=DATA[key]; if(!d) return;
  document.getElementById('pflag').src=d.flag;
  document.getElementById('pname').textContent=key;
  document.getElementById('pcap').textContent='Capital: '+d.capital;
  document.getElementById('sv-m').textContent=n(d.mesas);
  document.getElementById('sv-e').textContent=n(d.elec);
  const pct=((d.elec/TOTAL)*100);
  document.getElementById('sv-p').textContent=pct.toFixed(1)+'%';
  document.getElementById('sv-r').textContent=n(Math.round(d.elec/d.mesas));
  // pct real escalado: max municipio=Valencia~36%, escalar a 100%
  document.getElementById('pbar-fill').style.width=Math.min(pct/37*100,100)+'%';
  // parroquias
  const list=document.getElementById('ppar-list');
  list.innerHTML='';
  (d.parroquias||[]).forEach(p=>{
    const el=document.createElement('div');
    el.className='par-item';
    el.innerHTML=`<span class="pi"></span><span>${p}</span>`;
    list.appendChild(el);
  });
  panel.classList.add('open');
  if(!hintGone){hint.classList.add('gone');hintGone=true}
}

function closePanel(){
  panel.classList.remove('open');
  if(munLayer) munLayer.eachLayer(l=>l.setStyle(ST.mun_base));
  if(parLayer) parLayer.eachLayer(l=>l.setStyle(ST.par_base));
  selMun=null; curMunKey=null;
}
document.getElementById('pcls').addEventListener('click',closePanel);

/* ══════════════════════════════════════════════════════════════════
   INTERACCIONES MUNICIPIOS
══════════════════════════════════════════════════════════════════ */
function onEachMun(feat,layer){
  const raw=feat.properties.NAME_2||feat.properties.name||'';
  const key=matchKey(raw)||raw;

  layer.bindTooltip(key,{className:'mtt',sticky:true,offset:[14,0]});

  layer.on('mouseover',function(){
    if(this===selMun) return;
    this.setStyle(ST.mun_hov); this.bringToFront();
  });
  layer.on('mouseout',function(){
    if(this===selMun) return;
    this.setStyle(selMun?ST.mun_dim:ST.mun_base);
  });
  layer.on('click',function(e){
    L.DomEvent.stopPropagation(e);
    if(selMun&&selMun!==this) selMun.setStyle(ST.mun_dim);
    selMun=this; curMunKey=key;
    munLayer.eachLayer(l=>{if(l!==selMun) l.setStyle(ST.mun_dim)});
    selMun.setStyle(ST.mun_sel); selMun.bringToFront();
    map.fitBounds(selMun.getBounds(),{padding:[60,60],maxZoom:13});
    // resaltar parroquias del municipio
    highlightParroquias(key);
    const mk=matchKey(raw); if(mk) openPanel(mk);
  });
}

/* ══════════════════════════════════════════════════════════════════
   RESALTADO DE PARROQUIAS
══════════════════════════════════════════════════════════════════ */
function highlightParroquias(munKey){
  if(!parLayer) return;
  const munNorm=norm(munKey);
  parLayer.eachLayer(l=>{
    // El GeoJSON de parroquias debe tener municipio en properties
    const pMun=norm(
      l.feature.properties.municipio||
      l.feature.properties.MUNICIPIO||
      l.feature.properties.NAME_2||
      l.feature.properties.mun||''
    );
    const match=pMun===munNorm||pMun.includes(munNorm)||munNorm.includes(pMun);
    l.setStyle(match?ST.par_sel:ST.par_base);
    if(match) l.bringToFront();
  });
}

/* ══════════════════════════════════════════════════════════════════
   INTERACCIONES PARROQUIAS
══════════════════════════════════════════════════════════════════ */
function onEachPar(feat,layer){
  const name=feat.properties.parroquia||feat.properties.PARROQUIA||
             feat.properties.NAME_3||feat.properties.name||'Parroquia';
  layer.bindTooltip(name,{className:'mtt-par',sticky:true,offset:[10,0]});
}

/* ══════════════════════════════════════════════════════════════════
   CARGA DE DATOS
══════════════════════════════════════════════════════════════════ */
const MUN_URL = 'https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/20fa810cbe0cf9a47bf6ea735241492e515fd0b6/ven_admin2.json';
const PAR_URL = 'https://github.com/jhonmalorne/CoordinacionRegional/blob/3a2113a49d74493343291f7437e81e62feeeb535/parroquias_carabobo.geojson.json';

let loadedCount=0;
function onLoaded(){
  loadedCount++;
  if(loadedCount>=2) hideLoader();
}

function hideLoader(){
  const l=document.getElementById('loader');
  l.classList.add('done');
  setTimeout(()=>{if(l.parentNode)l.remove()},700);
}

function setMsg(t){document.getElementById('loader-msg').textContent=t}

// ── Municipios
setMsg('Cargando municipios…');
fetch(MUN_URL)
  .then(r=>{if(!r.ok) throw 0; return r.json()})
  .then(data=>{
    const feats=data.features.filter(f=>{
      const n1=(f.properties.NAME_1||f.properties.adm1||'').toLowerCase();
      return n1.includes('carabobo');
    });
    const col={type:'FeatureCollection',features:feats.length?feats:data.features};
    munLayer=L.geoJSON(col,{style:()=>ST.mun_base,onEachFeature:onEachMun}).addTo(map);
    munLayer.bringToFront();
    map.fitBounds(munLayer.getBounds(),{padding:[28,28]});
    onLoaded();
  })
  .catch(()=>{
    // Fallback marcadores
    Object.entries(DATA).forEach(([key,d])=>{
      L.circleMarker([d.lat,d.lng],{
        radius:Math.max(10,Math.sqrt(d.elec/800)),
        color:'#27c06a',weight:2,fillColor:'#1a3a8f',fillOpacity:0.75
      }).addTo(map)
       .bindTooltip(key,{className:'mtt',sticky:true})
       .on('click',()=>{map.setView([d.lat,d.lng],12);openPanel(key)});
    });
    onLoaded();
  });

// ── Parroquias
setMsg('Cargando parroquias…');
fetch(PAR_URL)
  .then(r=>{if(!r.ok) throw 0; return r.json()})
  .then(data=>{
    parLayer=L.geoJSON(data,{style:()=>ST.par_base,onEachFeature:onEachPar}).addTo(map);
    onLoaded();
  })
  .catch(()=>{
    // Parroquias como marcadores si falla el GeoJSON
    Object.entries(DATA).forEach(([munKey,d])=>{
      (d.parroquias||[]).forEach(pName=>{
        // Marcar en la capital del municipio (aproximación)
        L.circleMarker([d.lat,d.lng],{
          radius:4,color:'#5b9fff',weight:1,fillColor:'rgba(80,160,255,0.3)',fillOpacity:1
        }).addTo(map).bindTooltip(pName,{className:'mtt-par',sticky:true});
      });
    });
    onLoaded();
  });

// Click fuera → cerrar
map.on('click',()=>closePanel());
</script>
