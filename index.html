<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Electoral Interactivo | Concertación Carabobo</title>

    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />

    <style>
        :root {
            --blue-dark: #0b1e33;
            --blue-mid: #132d4a;
            --blue-institutional: #1a3f63;
            --green-institutional: #1a8a4a;
            --green-accent: #25b85f;
            --green-light: #2ecc71;
            --gold-accent: #d4a843;
            --gold-light: #f0cc6e;
            --white: #ffffff;
            --off-white: #f4f6f9;
            --gray-light: #e8ecf1;
            --gray-mid: #b0b8c1;
            --gray-dark: #5a6470;
            --shadow-sm: 0 2px 8px rgba(11, 30, 51, 0.08);
            --shadow-md: 0 6px 24px rgba(11, 30, 51, 0.12);
            --shadow-lg: 0 12px 40px rgba(11, 30, 51, 0.18);
            --shadow-glow: 0 0 28px rgba(37, 184, 95, 0.35);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.15, 1);
            --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --panel-width-desktop: 400px;
            --panel-height-mobile: 48vh;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background: var(--blue-dark);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== HEADER ========== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-mid) 60%, #0f2840 100%);
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow-lg);
            height: 58px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-title span {
            color: var(--green-light);
            font-weight: 800;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.75rem;
            color: var(--off-white);
            font-weight: 500;
            margin-left: auto;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .header-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green-light);
            box-shadow: 0 0 8px var(--green-accent);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 6px var(--green-accent);
            }
            50% {
                box-shadow: 0 0 16px var(--green-light), 0 0 28px rgba(46, 204, 113, 0.5);
            }
        }

        /* ========== MAP CONTAINER ========== */
        .map-container {
            position: fixed;
            top: 58px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            background: #e8ecf1;
        }
        #map {
            width: 100%;
            height: 100%;
            transition: filter var(--transition-smooth);
        }
        #map.dimmed-bg {
            filter: brightness(0.65);
        }

        /* ========== FLOATING STATS OVERLAY ========== */
        .stats-overlay {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: none;
        }
        .stat-chip {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-lg);
            padding: 10px 16px;
            box-shadow: var(--shadow-md);
            text-align: center;
            min-width: 90px;
            transition: all var(--transition-fast);
            cursor: default;
        }
        .stat-chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--green-accent);
        }
        .stat-chip .stat-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--blue-dark);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .stat-chip .stat-label {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* ========== SIDE PANEL ========== */
        .side-panel {
            position: fixed;
            top: 58px;
            right: 0;
            bottom: 0;
            width: var(--panel-width-desktop);
            max-width: 92vw;
            z-index: 900;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: -8px 0 40px rgba(11, 30, 51, 0.2);
            transform: translateX(105%);
            transition: transform var(--transition-bounce);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
            border-radius: var(--radius-xl) 0 0 var(--radius-xl);
        }
        .side-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--blue-institutional), var(--blue-mid));
            border-radius: var(--radius-xl) 0 0 0;
            color: var(--white);
            gap: 10px;
        }
        .panel-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1.2;
            margin: 0;
        }
        .panel-close-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            line-height: 1;
        }
        .panel-close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--white);
            transform: rotate(90deg);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.3);
        }

        .panel-body {
            padding: 18px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .panel-flag-wrapper {
            width: 100%;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            aspect-ratio: 16 / 10;
            background: var(--gray-light);
            position: relative;
            border: 3px solid rgba(255, 255, 255, 0.7);
        }
        .panel-flag-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform var(--transition-smooth);
        }
        .panel-flag-wrapper:hover img {
            transform: scale(1.04);
        }

        .info-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(200, 210, 220, 0.5);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-fast);
        }
        .info-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--green-accent);
        }
        .info-card .info-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--gray-dark);
            margin-bottom: 4px;
        }
        .info-card .info-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--blue-dark);
            letter-spacing: -0.01em;
        }
        .info-card .info-value.large {
            font-size: 1.5rem;
            color: var(--blue-institutional);
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .panel-logo-footer {
            margin-top: auto;
            text-align: center;
            padding: 10px 0 0;
        }
        .panel-logo-footer img {
            height: 40px;
            width: auto;
            opacity: 0.8;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.15));
            transition: opacity var(--transition-fast);
        }
        .panel-logo-footer img:hover {
            opacity: 1;
        }

        .panel-future-section {
            border-top: 1px dashed var(--gray-mid);
            padding-top: 12px;
            margin-top: 4px;
        }
        .panel-future-section .future-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--gray-mid);
            margin-bottom: 8px;
            text-align: center;
        }
        .future-placeholder {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .future-tag {
            font-size: 0.68rem;
            padding: 5px 10px;
            border-radius: 14px;
            background: rgba(180, 190, 200, 0.25);
            color: var(--gray-dark);
            border: 1px dashed var(--gray-mid);
            cursor: default;
            transition: all var(--transition-fast);
        }
        .future-tag:hover {
            background: rgba(37, 184, 95, 0.1);
            border-color: var(--green-accent);
            color: var(--green-institutional);
        }

        /* ========== MAP OVERLAY CONTROLS ========== */
        .map-controls-custom {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 600;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .layer-toggle-btn {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--blue-dark);
            box-shadow: var(--shadow-md);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .layer-toggle-btn:hover {
            background: var(--white);
            box-shadow: var(--shadow-lg);
            border-color: var(--green-accent);
            transform: translateY(-1px);
        }
        .layer-toggle-btn.active {
            background: var(--blue-institutional);
            color: var(--white);
            border-color: var(--blue-institutional);
            box-shadow: var(--shadow-glow);
        }
        .layer-toggle-btn .icon {
            font-size: 1rem;
        }

        /* ========== LEAFLET OVERRIDES ========== */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.82) !important;
            backdrop-filter: blur(18px) !important;
            -webkit-backdrop-filter: blur(18px) !important;
            border-radius: var(--radius-md) !important;
            box-shadow: var(--shadow-lg) !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            font-family: var(--font-sans) !important;
        }
        .leaflet-popup-content {
            margin: 10px 14px !important;
            font-size: 0.85rem !important;
            color: var(--blue-dark) !important;
        }
        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.82) !important;
            backdrop-filter: blur(18px) !important;
            -webkit-backdrop-filter: blur(18px) !important;
        }
        .leaflet-control-zoom a {
            border-radius: var(--radius-sm) !important;
            box-shadow: var(--shadow-md) !important;
            transition: all var(--transition-fast) !important;
        }
        .leaflet-control-zoom a:hover {
            background: var(--off-white) !important;
            box-shadow: var(--shadow-lg) !important;
        }

        /* Glow animation for hovered municipality */
        .leaflet-interactive.glow-hover {
            filter: drop-shadow(0 0 10px rgba(240, 204, 110, 0.7)) drop-shadow(0 0 22px rgba(37, 184, 95, 0.5));
            transition: filter 0.25s ease-out;
        }

        /* ========== LOADING SPINNER ========== */
        .loading-overlay {
            position: fixed;
            top: 58px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: rgba(11, 30, 51, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: var(--green-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 22px rgba(46, 204, 113, 0.5);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .header {
                padding: 8px 12px;
                height: 50px;
                gap: 8px;
            }
            .header-logo {
                height: 28px;
            }
            .header-title {
                font-size: 0.85rem;
            }
            .header-badge {
                font-size: 0.68rem;
                padding: 4px 10px;
                gap: 4px;
            }
            .map-container {
                top: 50px;
            }
            .side-panel {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-width: 100%;
                height: var(--panel-height-mobile);
                max-height: 55vh;
                transform: translateY(105%);
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.4);
                box-shadow: 0 -8px 40px rgba(11, 30, 51, 0.25);
            }
            .side-panel.open {
                transform: translateY(0);
            }
            .panel-header {
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
                padding: 12px 16px;
            }
            .panel-header h2 {
                font-size: 1rem;
            }
            .panel-body {
                padding: 12px 14px 18px;
                gap: 10px;
            }
            .info-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .info-card .info-value {
                font-size: 0.95rem;
            }
            .info-card .info-value.large {
                font-size: 1.2rem;
            }
            .stats-overlay {
                bottom: 12px;
                gap: 6px;
            }
            .stat-chip {
                padding: 7px 10px;
                min-width: 65px;
                border-radius: var(--radius-md);
            }
            .stat-chip .stat-value {
                font-size: 1rem;
            }
            .stat-chip .stat-label {
                font-size: 0.6rem;
            }
            .map-controls-custom {
                top: 10px;
                right: 10px;
                gap: 5px;
            }
            .layer-toggle-btn {
                padding: 7px 10px;
                font-size: 0.7rem;
                border-radius: 6px;
            }
        }

        @media (max-width: 400px) {
            .header-title {
                font-size: 0.72rem;
            }
            .header-badge {
                display: none;
            }
            .side-panel {
                height: 52vh;
                max-height: 60vh;
            }
            .info-row {
                grid-template-columns: 1fr;
            }
            .stats-overlay {
                bottom: 6px;
                gap: 4px;
            }
            .stat-chip {
                padding: 5px 8px;
                min-width: 55px;
            }
            .stat-chip .stat-value {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <img
        class="header-logo"
        src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true"
        alt="Logo Concertación Carabobo"
        loading="eager"
        onerror="this.style.display='none';"
        >
        <span class="header-title">Mapa Electoral <span>Carabobo</span></span>
        <div class="header-badge">
            <span class="dot"></span> 14 Municipios
        </div>
    </header>

    <!-- ==================== MAP CONTAINER ==================== -->
    <div class="map-container">
        <div id="map"></div>

        <!-- Floating stats overlay -->
        <div class="stats-overlay" id="statsOverlay">
            <div class="stat-chip">
                <div class="stat-value" id="statMesas">2.059</div>
                <div class="stat-label">Mesas</div>
            </div>
            <div class="stat-chip">
                <div class="stat-value" id="statElectores">1.663.942</div>
                <div class="stat-label">Electores</div>
            </div>
        </div>

        <!-- Custom layer toggle -->
        <div class="map-controls-custom">
            <button class="layer-toggle-btn active" id="btnStreet" title="Vista de mapa callejero">
                <span class="icon">🗺️</span> Mapa
            </button>
            <button class="layer-toggle-btn" id="btnSatellite" title="Vista satelital">
                <span class="icon">🛰️</span> Satélite
            </button>
        </div>
    </div>

    <!-- ==================== SIDE PANEL ==================== -->
    <aside class="side-panel" id="sidePanel" aria-label="Panel de información municipal">
        <div class="panel-header">
            <h2 id="panelMunicipioNombre">Selecciona un municipio</h2>
            <button class="panel-close-btn" id="panelCloseBtn" aria-label="Cerrar panel" title="Cerrar">✕</button>
        </div>
        <div class="panel-body">
            <!-- Bandera -->
            <div class="panel-flag-wrapper">
                <img
                id="panelBandera"
                src=""
                alt="Bandera del municipio"
                loading="lazy"
                onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22200%22><rect fill=%22%23e8ecf1%22 width=%22320%22 height=%22200%22/><text x=%22160%22 y=%22110%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2214%22 fill=%22%23b0b8c1%22>Bandera no disponible</text></svg>';"
                >
            </div>
            <!-- Capital -->
            <div class="info-card">
                <div class="info-label">📍 Capital</div>
                <div class="info-value" id="panelCapital">—</div>
            </div>
            <!-- Stats row -->
            <div class="info-row">
                <div class="info-card">
                    <div class="info-label">🗳️ Total Mesas</div>
                    <div class="info-value large" id="panelMesas">—</div>
                </div>
                <div class="info-card">
                    <div class="info-label">👥 Total Electores</div>
                    <div class="info-value large" id="panelElectores">—</div>
                </div>
            </div>
            <!-- Future expansion section -->
            <div class="panel-future-section">
                <div class="future-title">📋 Información Expandible</div>
                <div class="future-placeholder">
                    <span class="future-tag">👤 Líderes</span>
                    <span class="future-tag">📝 Notas de campo</span>
                    <span class="future-tag">📊 Histórico</span>
                    <span class="future-tag">🎯 Metas</span>
                </div>
            </div>
            <!-- Footer logo -->
            <div class="panel-logo-footer">
                <img
                src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true"
                alt="Concertación Carabobo"
                loading="lazy"
                >
            </div>
        </div>
    </aside>

    <!-- ==================== LOADING OVERLAY ==================== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
</script>

<script>
    (function() {
        // ============ DOM REFERENCES ============
        const mapEl = document.getElementById('map');
        const sidePanel = document.getElementById('sidePanel');
        const panelCloseBtn = document.getElementById('panelCloseBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const btnStreet = document.getElementById('btnStreet');
        const btnSatellite = document.getElementById('btnSatellite');
        const panelMunicipioNombre = document.getElementById('panelMunicipioNombre');
        const panelCapital = document.getElementById('panelCapital');
        const panelMesas = document.getElementById('panelMesas');
        const panelElectores = document.getElementById('panelElectores');
        const panelBandera = document.getElementById('panelBandera');
        const statMesas = document.getElementById('statMesas');
        const statElectores = document.getElementById('statElectores');

        // ============ MUNICIPALITY DATA ============
        // Extensible data structure for all 14 municipalities of Carabobo
        const municipiosData = {
            'valencia': {
                nombre: 'Valencia',
                capital: 'Valencia',
                mesas: 742,
                electores: 613670,
                coords: [10.153985, -67.988735],
                bandera: 'https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Valencia.jpg?raw=true',
                // Futuros campos: lideres, notasDeCampo, historico, metas
            },
            'diego ibarra': {

        // ============ HELPER: NORMALIZE STRING ============
        function normalize(str) {
            if (!str) return '';
            return str
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '') // remove diacritics
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, '') // remove special chars except spaces
                .trim();
        }

        // ============ HELPER: FORMAT NUMBER ============
        function formatNumber(num) {
            return Number(num).toLocaleString('es-VE');
        }

        // ============ MATCH MUNICIPALITY NAME TO DATA KEY ============
        function findMunicipioData(geoJsonName) {
            const normalizedInput = normalize(geoJsonName);
            // Direct match
            if (municipiosData[normalizedInput]) {
                return municipiosData[normalizedInput];
            }
            // Fuzzy: check if any key contains the input or vice versa
            for (const [key, data] of Object.entries(municipiosData)) {
                if (key.includes(normalizedInput) || normalizedInput.includes(key)) {
                    return data;
                }
            }
            // Try matching just the municipality name field
            for (const [key, data] of Object.entries(municipiosData)) {
                if (normalize(data.nombre) === normalizedInput) {
                    return data;
                }
            }
            return null;
        }

        // ============ LEAFLET MAP INITIALIZATION ============
        const caraboboCenter = [10.15, -68.0];
        const defaultZoom = 10;

        const map = L.map('map', {
            center: caraboboCenter,
            zoom: defaultZoom,
            zoomControl: true,
            attributionControl: true,
            minZoom: 8,
            maxZoom: 17,
            scrollWheelZoom: true,
            doubleClickZoom: true,
            dragging: true,
        });

        // ---- Base Layers ----
        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
        });

        const satelliteLayer = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
                maxZoom: 19,
            });

        // Default: street map
        streetLayer.addTo(map);
        let currentBaseLayer = 'street';

        // ---- Layer toggle buttons ----
        function setBaseLayer(layerType) {
            if (layerType === 'street' && currentBaseLayer !== 'street') {
                map.removeLayer(satelliteLayer);
                streetLayer.addTo(map);
                currentBaseLayer = 'street';
                btnStreet.classList.add('active');
                btnSatellite.classList.remove('active');
            } else if (layerType === 'satellite' && currentBaseLayer !== 'satellite') {
                map.removeLayer(streetLayer);
                satelliteLayer.addTo(map);
                currentBaseLayer = 'satellite';
                btnSatellite.classList.add('active');
                btnStreet.classList.remove('active');
            }
        }

        btnStreet.addEventListener('click', () => setBaseLayer('street'));
        btnSatellite.addEventListener('click', () => setBaseLayer('satellite'));

        // ============ GEOJSON LAYER & STATE ============
        let geoJsonLayer = null;
        let allPolygonLayers = []; // track all L.Polygon instances
        let selectedLayer = null; // currently selected polygon
        let isPanelOpen = false;

        // Style definitions
        const defaultStyle = {
            fillColor: '#1a8a4a',
            fillOpacity: 0.38,
            color: '#1a3f63',
            weight: 1.8,
            dashArray: null,
            opacity: 0.85,
        };

        const hoverStyle = {
            fillColor: '#25b85f',
            fillOpacity: 0.55,
            color: '#f0cc6e',
            weight: 3.2,
            dashArray: null,
            opacity: 1,
        };

        const selectedStyle = {
            fillColor: '#1a8a4a',
            fillOpacity: 0.65,
            color: '#f0cc6e',
            weight: 4,
            dashArray: null,
            opacity: 1,
        };

        const dimmedStyle = {
            fillColor: '#95a5a6',
            fillOpacity: 0.18,
            color: '#7f8c8d',
            weight: 1,
            dashArray: '4 3',
            opacity: 0.5,
        };

        // ============ RESET ALL LAYERS TO DEFAULT ============
        function resetAllLayers() {
            allPolygonLayers.forEach(layer => {
                layer.setStyle(defaultStyle);
                // Remove glow class
                if (layer._path) {
                    layer._path.classList.remove('glow-hover');
                }
            });
            selectedLayer = null;
            mapEl.classList.remove('dimmed-bg');
        }

        // ============ DIM ALL EXCEPT SELECTED ============
        function dimAllExcept(selected) {
            allPolygonLayers.forEach(layer => {
                if (layer === selected) {
                    layer.setStyle(selectedStyle);
                    if (layer._path) {
                        layer._path.classList.add('glow-hover');
                    }
                } else {
                    layer.setStyle(dimmedStyle);
                    if (layer._path) {
                        layer._path.classList.remove('glow-hover');
                    }
                }
            });
            mapEl.classList.add('dimmed-bg');
        }

        // ============ OPEN SIDE PANEL ============
        function openSidePanel(municipioData) {
            if (!municipioData) return;
            panelMunicipioNombre.textContent = municipioData.nombre;
            panelCapital.textContent = municipioData.capital;
            panelMesas.textContent = formatNumber(municipioData.mesas);
            panelElectores.textContent = formatNumber(municipioData.electores);
            panelBandera.src = municipioData.bandera || '';
            panelBandera.alt = 'Bandera de ' + municipioData.nombre;
            sidePanel.classList.add('open');
            isPanelOpen = true;
        }

        // ============ CLOSE SIDE PANEL ============
        function closeSidePanel() {
            sidePanel.classList.remove('open');
            isPanelOpen = false;
            resetAllLayers();
            // Reset zoom to show all Carabobo
            if (geoJsonLayer) {
                try {
                    const allBounds = geoJsonLayer.getBounds();
                    if (allBounds.isValid()) {
                        map.fitBounds(allBounds, {
                            padding: [40, 40],
                            maxZoom: 11,
                            duration: 0.6,
                        });
                    }
                } catch (e) {
                    map.setView(caraboboCenter, defaultZoom, { duration: 0.6 });
                }
            } else {
                map.setView(caraboboCenter, defaultZoom, { duration: 0.6 });
            }
        }

        panelCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSidePanel();
        });

        // Close panel with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isPanelOpen) {
                closeSidePanel();
            }
        });

        // ============ HANDLE MUNICIPALITY CLICK ============
        function handleMunicipioClick(layer, municipioData, featureBounds) {
            if (selectedLayer === layer) {
                // Deselect if clicking the same municipality
                closeSidePanel();
                return;
            }
            resetAllLayers();
            selectedLayer = layer;
            dimAllExcept(layer);
            openSidePanel(municipioData);

            // Zoom to feature bounds with padding for side panel
            if (featureBounds && featureBounds.isValid()) {
                const isMobile = window.innerWidth <= 768;
                const paddingRight = isMobile ? 30 : 420; // account for side panel on desktop
                const paddingTop = isMobile ? 180 : 50;
                map.fitBounds(featureBounds, {
                    paddingTopLeft: [30, paddingTop],
                    paddingBottomRight: [paddingRight, 30],
                    maxZoom: 14,
                    duration: 0.7,
                });
            }
        }

        // ============ GEOJSON ON EACH FEATURE ============
        function onEachFeature(feature, layer) {
            // Store reference
            allPolygonLayers.push(layer);

            // Attempt to extract municipality name from GeoJSON properties
            const props = feature.properties || {};
            const possibleNames = [
                props.NAME_2,
                props.NOM_MUN,
                props.MUNICIPIO,
                props.admin2Name,
                props.name,
                props.NOMBRE,
                props.municipio,
                props.MUN,
            ].filter(Boolean);

            const geoJsonName = possibleNames[0] || 'Desconocido';
            const municipioData = findMunicipioData(geoJsonName);

            // Store data on the layer for later use
            layer._municipioData = municipioData;
            layer._geoJsonName = geoJsonName;

            // ---- Hover effects ----
            layer.on('mouseover', function(e) {
                const lyr = e.target;
                if (lyr === selectedLayer) return; // don't override selected style
                lyr.setStyle(hoverStyle);
                if (lyr._path) {
                    lyr._path.classList.add('glow-hover');
                }
                lyr.bringToFront();
                // Small tooltip on hover
                const displayName = municipioData ? municipioData.nombre : geoJsonName;
                lyr.bindTooltip(displayName, {
                    sticky: true,
                    direction: 'top',
                    offset: [0, -8],
                    className: 'custom-tooltip',
                    opacity: 0.92,
                }).openTooltip(e.latlng);
            });

            layer.on('mouseout', function(e) {
                const lyr = e.target;
                if (lyr === selectedLayer) return;
                lyr.setStyle(defaultStyle);
                if (lyr._path) {
                    lyr._path.classList.remove('glow-hover');
                }
                lyr.unbindTooltip();
            });

            // ---- Click handler ----
            layer.on('click', function(e) {
                L.DomEvent.stopPropagation(e);
                const lyr = e.target;
                const data = lyr._municipioData;
                const bounds = lyr.getBounds ? lyr.getBounds() : null;
                if (data) {
                    handleMunicipioClick(lyr, data, bounds);
                } else {
                    // Fallback: show basic info if no match found
                    const fallbackData = {
                        nombre: lyr._geoJsonName || 'Municipio',
                        capital: 'No disponible',
                        mesas: 0,
                        electores: 0,
                        bandera: '',
                    };
                    handleMunicipioClick(lyr, fallbackData, bounds);
                }
            });
        }

        // ============ FILTER GEOJSON FOR CARABOBO ============
        function filterCarabobo(feature) {
            const props = feature.properties || {};
            const stateFields = [
                props.NAME_1,
                props.NOM_EDO,
                props.ESTADO,
                props.admin1Name,
                props.state,
                props.STATE,
                props.estado,
            ];
            for (const val of stateFields) {
                if (val && normalize(val).includes('carabobo')) {
                    return true;
                }
            }
            return false;
        }

        // ============ LOAD GEOJSON ============
        const geoJsonUrl =
            'https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/20fa810cbe0cf9a47bf6ea735241492e515fd0b6/ven_admin2.json';

        function loadGeoJSON() {
            loadingOverlay.classList.remove('hidden');
            fetch(geoJsonUrl)
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    // Filter for Carabobo only
                    const caraboboFeatures = data.features ? data.features.filter(filterCarabobo) : [];
                    if (caraboboFeatures.length === 0) {
                        console.warn('No se encontraron municipios de Carabobo en el GeoJSON. Intentando cargar todos los features...');
                        // Fallback: try loading all features that might be in Carabobo area
                        const fallbackFeatures = data.features ? data.features.filter(f => {
                            const props = f.properties || {};
                            const allVals = Object.values(props).map(v => String(v));
                            return allVals.some(v => normalize(v).includes('carabobo'));
                        }) : [];
                        if (fallbackFeatures.length > 0) {
                            createGeoJsonLayer({ ...data, features: fallbackFeatures });
                        } else {
                            throw new Error(
                                'No se pudo filtrar Carabobo. Verifica la estructura del GeoJSON.');
                        }
                    } else {
                        createGeoJsonLayer({ ...data, features: caraboboFeatures });
                    }
                })
                .catch(err => {
                    console.error('Error cargando GeoJSON:', err);
                    loadingOverlay.classList.add('hidden');
                    // Show error on map
                    const errorPopup = L.popup()
                        .setLatLng(caraboboCenter)
                        .setContent(
                            '<strong>⚠️ Error al cargar datos</strong><br><small>Verifica la conexión e intenta recargar.</small>'
                            )
                        .openOn(map);
                    // Retry hint
                    statMesas.textContent = 'Error';
                    statElectores.textContent = 'Recargar';
                });
        }

        function createGeoJsonLayer(geoJsonData) {
            geoJsonLayer = L.geoJSON(geoJsonData, {
                style: defaultStyle,
                onEachFeature: onEachFeature,
            }).addTo(map);

            // Fit map to show all Carabobo municipalities
            const bounds = geoJsonLayer.getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, {
                    padding: [35, 35],
                    maxZoom: 11,
                    duration: 0.5,
                });
            }

            // Update stats
            const totalMesas = Object.values(municipiosData).reduce((sum, d) => sum + d.mesas, 0);
            const totalElectores = Object.values(municipiosData).reduce((sum, d) => sum + d.electores, 0);
            statMesas.textContent = formatNumber(totalMesas);
            statElectores.textContent = formatNumber(totalElectores);

            // Hide loading
            loadingOverlay.classList.add('hidden');

            console.log(
                `✅ Cargados ${geoJsonData.features.length} municipios de Carabobo | ${allPolygonLayers.length} capas renderizadas`
                );
        }

        // ============ CLICK ON MAP BACKGROUND TO DESELECT ============
        map.on('click', function(e) {
            // If panel is open and user clicks map background, close panel
            if (isPanelOpen && selectedLayer) {
                // Check if the click was on a feature (handled by feature click with stopPropagation)
                // This only fires for background clicks
                closeSidePanel();
            }
        });

        // ============ RESPONSIVE: ADJUST ON RESIZE ============
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                map.invalidateSize();
                // If panel is open on mobile, adjust padding
                if (isPanelOpen && selectedLayer && selectedLayer.getBounds) {
                    const bounds = selectedLayer.getBounds();
                    if (bounds.isValid()) {
                        const isMobile = window.innerWidth <= 768;
                        const paddingRight = isMobile ? 30 : 420;
                        const paddingTop = isMobile ? 200 : 50;
                        map.fitBounds(bounds, {
                            paddingTopLeft: [30, paddingTop],
                            paddingBottomRight: [paddingRight, 30],
                            maxZoom: 14,
                            duration: 0.4,
                        });
                    }
                }
            }, 250);
        });

        // ============ INITIAL LOAD ============
        loadGeoJSON();

        // ============ EXPORT FOR DEBUG ============
        // Expose key references to window for console debugging
        window._caraboboMap = {
            map,
            geoJsonLayer,
            allPolygonLayers,
            selectedLayer,
            municipiosData,
            resetAllLayers,
            closeSidePanel,
            openSidePanel,
            findMunicipioData,
        };

        console.log('🗺️  Mapa Electoral de Carabobo inicializado.');
        console.log('   Concertación Carabobo — Dashboard Interactivo');
        console.log('   Comandos disponibles: window._caraboboMap');
        console.log('   🖱️  Haz clic en un municipio para ver detalles.');
        console.log('   🛰️  Usa los botones para alternar entre mapa y satélite.');
    })();
</script>
