<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Electoral · Concertación Carabobo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:      #0a2463;
      --blue-mid:  #1a3a8f;
      --blue-lite: #2255c8;
      --green:     #1b8a4c;
      --green-lit: #27c06a;
      --white:     #f4f7ff;
      --glass:     rgba(255,255,255,0.07);
      --glass-bd:  rgba(255,255,255,0.15);
      --panel-w:   340px;
      --header-h:  64px;
      --radius:    14px;
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    html, body { height: 100%; background: #050d1f; color: var(--white); font-family: var(--font-body); overflow: hidden; }

    /* HEADER */
    #header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 1000;
      background: linear-gradient(90deg, var(--blue) 0%, #0d1f55 60%, #0a2a1a 100%);
      border-bottom: 1px solid var(--glass-bd);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      backdrop-filter: blur(12px); box-shadow: 0 2px 24px rgba(0,0,0,.6);
    }
    #header .brand { display: flex; align-items: center; gap: 12px; }
    #header img.logo { height: 46px; filter: drop-shadow(0 0 8px rgba(39,192,106,.4)); }
    #header .brand-text { display: flex; flex-direction: column; line-height: 1; }
    #header .brand-text span:first-child { font-family: var(--font-head); font-weight: 900; font-size: 1.35rem; letter-spacing: .08em; text-transform: uppercase; color: var(--white); }
    #header .brand-text span:last-child { font-family: var(--font-head); font-weight: 300; font-size: .8rem; letter-spacing: .22em; text-transform: uppercase; color: var(--green-lit); margin-top: 2px; }
    #header .header-stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    #header .header-stat .val { font-family: var(--font-head); font-weight: 700; font-size: 1.4rem; color: var(--green-lit); letter-spacing: .05em; }
    #header .header-stat .lbl { font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; opacity: .6; }

    /* LAYOUT */
    #app { display: flex; height: 100%; padding-top: var(--header-h); }
    #map { flex: 1; height: 100%; z-index: 1; background: #050d1f; }

    /* LAYER SWITCHER */
    #layer-switcher {
      position: fixed; bottom: 24px; right: 14px; z-index: 900;
      display: flex; flex-direction: column; gap: 6px;
    }
    .layer-btn {
      display: flex; align-items: center; gap: 8px;
      background: rgba(5,20,50,0.88); border: 1px solid var(--glass-bd);
      border-radius: 8px; padding: 7px 12px; cursor: pointer;
      font-family: var(--font-head); font-size: .78rem; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(244,247,255,.6);
      transition: background .2s, border-color .2s, color .2s;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    .layer-btn:hover { background: rgba(20,50,120,.7); color: var(--white); }
    .layer-btn.active { border-color: var(--green-lit); color: var(--green-lit); background: rgba(27,138,76,.15); }
    .layer-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* SIDE PANEL */
    #panel {
      position: fixed; top: var(--header-h); right: -360px; width: var(--panel-w);
      height: calc(100% - var(--header-h));
      background: linear-gradient(160deg, rgba(10,36,99,.92) 0%, rgba(5,20,50,.97) 100%);
      border-left: 1px solid var(--glass-bd); backdrop-filter: blur(18px); z-index: 900;
      transition: right .4s cubic-bezier(.22,1,.36,1); display: flex; flex-direction: column;
      overflow: hidden; box-shadow: -6px 0 40px rgba(0,0,0,.5);
    }
    #panel.open { right: 0; }
    #panel-close {
      position: absolute; top: 12px; right: 14px; width: 32px; height: 32px;
      border: 1px solid var(--glass-bd); border-radius: 50%; background: var(--glass);
      color: var(--white); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .2s; z-index: 10;
    }
    #panel-close:hover { background: rgba(255,255,255,.15); transform: rotate(90deg); }
    #panel-hero {
      position: relative; padding: 28px 24px 20px; border-bottom: 1px solid var(--glass-bd);
      background: linear-gradient(135deg, rgba(27,138,76,.12) 0%, rgba(10,36,99,.0) 60%);
    }
    #panel-flag { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.5); border: 1px solid var(--glass-bd); }
    #panel-name { font-family: var(--font-head); font-weight: 900; font-size: 2rem; letter-spacing: .04em; text-transform: uppercase; color: var(--white); line-height: 1; }
    #panel-capital { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--green-lit); margin-top: 4px; opacity: .85; }
    #panel-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
    .stat-card {
      background: var(--glass); border: 1px solid var(--glass-bd); border-radius: var(--radius);
      padding: 16px 14px; display: flex; flex-direction: column; gap: 6px;
      position: relative; overflow: hidden; transition: border-color .2s, background .2s;
    }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--green) 0%, var(--blue-lite) 100%); opacity: 0; transition: opacity .3s; }
    .stat-card:hover { background: rgba(255,255,255,.1); }
    .stat-card:hover::before { opacity: 1; }
    .stat-card .s-icon { font-size: 1.4rem; line-height: 1; }
    .stat-card .s-val { font-family: var(--font-head); font-weight: 700; font-size: 1.55rem; color: var(--white); letter-spacing: .02em; }
    .stat-card .s-lbl { font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: rgba(244,247,255,.45); }
    #panel-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--glass-bd); display: flex; align-items: center; gap: 10px; }
    #panel-footer img { height: 38px; filter: drop-shadow(0 0 6px rgba(39,192,106,.35)); }
    #panel-footer span { font-family: var(--font-head); font-weight: 500; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }

    /* TOOLTIP */
    .map-tooltip {
      background: rgba(5,20,50,0.92) !important; border: 1px solid rgba(39,192,106,.4) !important;
      border-radius: 8px !important; color: var(--white) !important;
      font-family: var(--font-head) !important; font-weight: 700 !important;
      font-size: .95rem !important; letter-spacing: .08em !important;
      text-transform: uppercase !important; padding: 6px 12px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,.5), 0 0 12px rgba(39,192,106,.15) !important;
      backdrop-filter: blur(8px) !important; white-space: nowrap !important;
    }
    .leaflet-tooltip-top.map-tooltip::before { border-top-color: rgba(39,192,106,.4) !important; }

    /* HINT */
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(5,20,50,.88); border: 1px solid var(--glass-bd);
      border-radius: 30px; padding: 8px 20px;
      font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
      opacity: .75; z-index: 800; pointer-events: none; transition: opacity .5s;
      backdrop-filter: blur(8px);
    }
    #hint.hidden { opacity: 0; }
    .leaflet-control-attribution { display: none !important; }

    /* LOADER */
    #loader {
      position: fixed; inset: 0; background: #050d1f; z-index: 2000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      transition: opacity .5s;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    .spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,.1); border-top-color: var(--green-lit); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader span { font-family: var(--font-head); font-size: .75rem; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.4); }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      :root { --panel-w: 100vw; }
      #panel { top: auto; bottom: -100vh; right: 0; height: 65vh; width: 100%; border-left: none; border-top: 1px solid var(--glass-bd); border-radius: 20px 20px 0 0; transition: bottom .4s cubic-bezier(.22,1,.36,1); }
      #panel.open { bottom: 0; right: 0; }
      #header .brand-text span:first-child { font-size: 1.1rem; }
      #layer-switcher { bottom: 14px; right: 8px; }
    }
  </style>
</head>

<!-- LOADER -->
<div id="loader">
  <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true"

  <div class="spinner"></div>
  <span>Cargando mapa electoral…</span>
</div>

<!-- HEADER -->

    <div class="brand-text">
      <span>Concertación Carabobo</span>
      <span>Mapa Electoral Estratégico</span>
    </div>
  </div>
  <div class="header-stat">
    <span class="val">1.663.942</span>
    <span class="lbl">Electores en Carabobo</span>
  </div>
</header>

<div id="app">
  <div id="map"></div>
</div>

<!-- LAYER SWITCHER -->
<div id="layer-switcher">

</div>

<!-- SIDE PANEL -->
<div id="panel">

    <img id="panel-flag" src="" alt="Bandera" />

    <div id="panel-capital">Capital: —</div>
  </div>
  <div id="panel-stats">

    <div class="stat-card"><span class="s-icon">👥</span><span class="s-val" id="stat-electores">—</span><span class="s-lbl">Electores</span></div>
    <div class="stat-card"><span class="s-icon">📊</span><span class="s-val" id="stat-pct">—</span><span class="s-lbl">% del Estado</span></div>
    <div class="stat-card"><span class="s-icon">🏛️</span><span class="s-val" id="stat-ratio">—</span><span class="s-lbl">Electores/Mesa</span></div>
  </div>
  <div id="panel-footer">
    <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true" alt="Logo" />
    <span>Concertación Carabobo · 2025</span>
  </div>
</div>

<div id="hint">Haz clic en un municipio para ver su información</div>

/* ════════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════ */
const TILES = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
         { subdomains:'abcd', maxZoom:19 }),
  osm:  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
         { subdomains:'abc', maxZoom:19 }),
  sat:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
         { maxZoom:19 }),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
         { subdomains:'abc', maxZoom:17 }),
};

const map = L.map('map', {
  center:[10.18, -68.0], zoom:10,
  zoomControl:true, attributionControl:false,
  layers:[TILES.dark]
});
map.zoomControl.setPosition('topright');

let currentTile = 'dark';
function switchLayer(name) {
  map.removeLayer(TILES[currentTile]);
  map.addLayer(TILES[name]);
  TILES[name].bringToBack();
  if (geojsonLayer) geojsonLayer.bringToFront();
  currentTile = name;
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name).classList.add('active');
}

/* ════════════════════════════════════════════════════════════
   ESTILOS
════════════════════════════════════════════════════════════ */
const S = {
  normal:   f => ({ color:'#27c06a', weight:1.8, fillColor:'#1a3a8f', fillOpacity:0.55, opacity:1 }),
  hover:        { color:'#5b9fff',  weight:2.5, fillColor:'#2255c8', fillOpacity:0.75, opacity:1 },
  selected:     { color:'#27c06a',  weight:3,   fillColor:'#1b8a4c', fillOpacity:0.72, opacity:1 },
  dim:          { color:'#0d2060',  weight:1,   fillColor:'#07163a', fillOpacity:0.25, opacity:0.4 },
};

let selectedLayer = null;
let geojsonLayer  = null;

/* ════════════════════════════════════════════════════════════
   PANEL
════════════════════════════════════════════════════════════ */
const panel    = document.getElementById('panel');
const hint     = document.getElementById('hint');
let hintHidden = false;

function fmt(n){ return n.toLocaleString('es-VE'); }

function openPanel(key) {
  const d = MUNICIPIOS[key]; if(!d) return;
  document.getElementById('panel-flag').src           = d.flag;
  document.getElementById('panel-name').textContent   = key;
  document.getElementById('panel-capital').textContent= 'Capital: ' + d.capital;
  document.getElementById('stat-mesas').textContent   = fmt(d.mesas);
  document.getElementById('stat-electores').textContent = fmt(d.electores);
  document.getElementById('stat-pct').textContent     = ((d.electores/TOTAL_ELECTORES)*100).toFixed(1)+'%';
  document.getElementById('stat-ratio').textContent   = fmt(Math.round(d.electores/d.mesas));
  panel.classList.add('open');
  if(!hintHidden){ hint.classList.add('hidden'); hintHidden=true; }
}

function closePanel() {
  panel.classList.remove('open');
  if(geojsonLayer) geojsonLayer.eachLayer(l => l.setStyle(S.normal(l.feature)));
  selectedLayer = null;
}
document.getElementById('panel-close').addEventListener('click', closePanel);

/* ════════════════════════════════════════════════════════════
   MATCH DE NOMBRES
════════════════════════════════════════════════════════════ */
function matchKey(raw) {
  if(!raw) return null;
  raw = raw.trim();
  if(MUNICIPIOS[raw]) return raw;
  const lo = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const k of Object.keys(MUNICIPIOS)){
    const kn = k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(lo===kn || lo.includes(kn) || kn.includes(lo)) return k;
  }
  return null;
}

/* ════════════════════════════════════════════════════════════
   INTERACTIONS
════════════════════════════════════════════════════════════ */
function onEachFeature(feature, layer) {
  const raw = feature.properties.NAME_2 || '';
  const key = matchKey(raw) || raw;
  layer.bindTooltip(key, { className:'map-tooltip', sticky:true, offset:[12,0] });

  layer.on('mouseover', function() {
    if(this===selectedLayer) return;
    this.setStyle(S.hover); this.bringToFront();
  });
  layer.on('mouseout', function() {
    if(this===selectedLayer) return;
    this.setStyle(selectedLayer ? S.dim : S.normal(this.feature));
  });
  layer.on('click', function() {
    if(selectedLayer && selectedLayer!==this) selectedLayer.setStyle(S.dim);
    selectedLayer = this;
    geojsonLayer.eachLayer(l => { if(l!==selectedLayer) l.setStyle(S.dim); });
    selectedLayer.setStyle(S.selected); selectedLayer.bringToFront();
    map.fitBounds(selectedLayer.getBounds(), { padding:[60,60], maxZoom:13 });
    const mk = matchKey(raw); if(mk) openPanel(mk);
  });
}

/* ════════════════════════════════════════════════════════════
   CARGAR GEOJSON
════════════════════════════════════════════════════════════ */
function loadMap(geojson) {
  geojsonLayer = L.geoJSON(geojson, { style:S.normal, onEachFeature }).addTo(map);
  geojsonLayer.bringToFront();
  map.fitBounds(geojsonLayer.getBounds(), { padding:[30,30] });
  setTimeout(()=>{
    document.getElementById('loader').classList.add('done');
    setTimeout(()=>{ const l=document.getElementById('loader'); if(l) l.remove(); },600);
  },500);
}

/* Intentar cargar ven_admin2.json externo; si falla usar el GeoJSON embebido */
fetch('ven_admin2.json')
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(data => {
    const feats = data.features.filter(f => {
      const a = (f.properties.NAME_1||f.properties.adm1||'').toLowerCase();
      return a.includes('carabobo');
    });
    loadMap({ type:'FeatureCollection', features: feats.length ? feats : data.features });
  })
  .catch(() => loadMap(CARABOBO_GEOJSON));
