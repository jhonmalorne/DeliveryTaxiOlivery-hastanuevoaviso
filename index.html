<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Electoral · Concertación Carabobo</title>
 
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
 
  <style>
    /* ─── RESET & TOKENS ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --blue:      #0a2463;
      --blue-mid:  #1a3a8f;
      --blue-lite: #2255c8;
      --green:     #1b8a4c;
      --green-lit: #27c06a;
      --white:     #f4f7ff;
      --glass:     rgba(255,255,255,0.07);
      --glass-bd:  rgba(255,255,255,0.15);
      --shadow:    0 8px 32px rgba(0,0,0,0.45);
      --panel-w:   340px;
      --header-h:  64px;
      --radius:    14px;
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
 
    html, body {
      height: 100%;
      background: #050d1f;
      color: var(--white);
      font-family: var(--font-body);
      overflow: hidden;
    }
 
    /* ─── HEADER ───────────────────────────────────────────────────── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 1000;
      background: linear-gradient(90deg, var(--blue) 0%, #0d1f55 60%, #0a2a1a 100%);
      border-bottom: 1px solid var(--glass-bd);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 24px rgba(0,0,0,0.6);
    }
 
    #header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
 
    #header img.logo {
      height: 46px;
      filter: drop-shadow(0 0 8px rgba(39,192,106,0.4));
    }
 
    #header .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
 
    #header .brand-text span:first-child {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--white);
    }
 
    #header .brand-text span:last-child {
      font-family: var(--font-head);
      font-weight: 300;
      font-size: .8rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--green-lit);
      margin-top: 2px;
    }
 
    #header .header-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
 
    #header .header-stat .val {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--green-lit);
      letter-spacing: .05em;
    }
 
    #header .header-stat .lbl {
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .6;
    }
 
    /* ─── LAYOUT ───────────────────────────────────────────────────── */
    #app {
      display: flex;
      height: 100%;
      padding-top: var(--header-h);
    }
 
    /* ─── MAP ──────────────────────────────────────────────────────── */
    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
      background: #050d1f;
    }
 
    /* Leaflet tile override for dark look */
    .leaflet-tile { filter: brightness(.55) saturate(.4) hue-rotate(190deg); }
    .leaflet-container { background: #050d1f; }
 
    /* ─── SIDE PANEL ───────────────────────────────────────────────── */
    #panel {
      position: fixed;
      top: var(--header-h);
      right: -360px;
      width: var(--panel-w);
      height: calc(100% - var(--header-h));
      background: linear-gradient(160deg, rgba(10,36,99,0.92) 0%, rgba(5,20,50,0.97) 100%);
      border-left: 1px solid var(--glass-bd);
      backdrop-filter: blur(18px);
      z-index: 900;
      transition: right .4s cubic-bezier(.22,1,.36,1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: -6px 0 40px rgba(0,0,0,0.5);
    }
 
    #panel.open { right: 0; }
 
    /* close button */
    #panel-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--glass-bd);
      border-radius: 50%;
      background: var(--glass);
      color: var(--white);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .2s;
      z-index: 10;
    }
    #panel-close:hover { background: rgba(255,255,255,.15); transform: rotate(90deg); }
 
    /* Panel hero */
    #panel-hero {
      position: relative;
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--glass-bd);
      background: linear-gradient(135deg, rgba(27,138,76,0.12) 0%, rgba(10,36,99,0.0) 60%);
    }
 
    #panel-flag {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid var(--glass-bd);
    }
 
    #panel-name {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1;
    }
 
    #panel-capital {
      font-size: .75rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--green-lit);
      margin-top: 4px;
      opacity: .85;
    }
 
    /* Stats grid */
    #panel-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 20px 20px;
    }
 
    .stat-card {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s, background .2s;
    }
 
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--green) 0%, var(--blue-lite) 100%);
      opacity: 0;
      transition: opacity .3s;
    }
 
    .stat-card:hover { background: rgba(255,255,255,.1); }
    .stat-card:hover::before { opacity: 1; }
 
    .stat-card .s-icon {
      font-size: 1.4rem;
      line-height: 1;
    }
 
    .stat-card .s-val {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.55rem;
      color: var(--white);
      letter-spacing: .02em;
    }
 
    .stat-card .s-lbl {
      font-size: .64rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(244,247,255,.45);
    }
 
    /* Panel footer brand */
    #panel-footer {
      margin-top: auto;
      padding: 16px 20px;
      border-top: 1px solid var(--glass-bd);
      display: flex;
      align-items: center;
      gap: 10px;
    }
 
    #panel-footer img {
      height: 38px;
      filter: drop-shadow(0 0 6px rgba(39,192,106,0.35));
    }
 
    #panel-footer span {
      font-family: var(--font-head);
      font-weight: 500;
      font-size: .8rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .55;
    }
 
    /* ─── MAP TOOLTIP ──────────────────────────────────────────────── */
    .map-tooltip {
      background: rgba(5,20,50,0.92) !important;
      border: 1px solid rgba(39,192,106,0.4) !important;
      border-radius: 8px !important;
      color: var(--white) !important;
      font-family: var(--font-head) !important;
      font-weight: 700 !important;
      font-size: .95rem !important;
      letter-spacing: .08em !important;
      text-transform: uppercase !important;
      padding: 6px 12px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 12px rgba(39,192,106,0.15) !important;
      backdrop-filter: blur(8px) !important;
      white-space: nowrap !important;
    }
 
    .leaflet-tooltip-top.map-tooltip::before {
      border-top-color: rgba(39,192,106,0.4) !important;
    }
 
    /* ─── HINT BADGE ───────────────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(5,20,50,0.88);
      border: 1px solid var(--glass-bd);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .75;
      z-index: 800;
      pointer-events: none;
      transition: opacity .5s;
      backdrop-filter: blur(8px);
    }
    #hint.hidden { opacity: 0; }
 
    /* ─── ATTRIBUTION ──────────────────────────────────────────────── */
    .leaflet-control-attribution { display: none !important; }
 
    /* ─── RESPONSIVE ───────────────────────────────────────────────── */
    @media (max-width: 640px) {
      :root { --panel-w: 100vw; }
 
      #panel {
        top: auto;
        bottom: -100vh;
        right: 0;
        height: 65vh;
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--glass-bd);
        border-radius: 20px 20px 0 0;
        transition: bottom .4s cubic-bezier(.22,1,.36,1);
      }
 
      #panel.open { bottom: 0; right: 0; }
 
      #header .brand-text span:first-child { font-size: 1.1rem; }
 
      #panel-stats { grid-template-columns: 1fr 1fr; }
    }
 
    /* ─── SPINNER ──────────────────────────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      background: #050d1f;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity .5s;
    }
 
    #loader.done { opacity: 0; pointer-events: none; }
 
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--green-lit);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
 
    @keyframes spin { to { transform: rotate(360deg); } }
 
    #loader span {
      font-family: var(--font-head);
      font-size: .75rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
    }
  </style>
</head>
<body>
 
<!-- ── LOADER ─────────────────────────────────────────────────── -->
<div id="loader">
  <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true"
       style="height:70px;filter:drop-shadow(0 0 16px rgba(39,192,106,.5))" alt="logo" />
  <div class="spinner"></div>
  <span>Cargando mapa electoral…</span>
</div>
 
<!-- ── HEADER ─────────────────────────────────────────────────── -->
<header id="header">
  <div class="brand">
    <img class="logo"
         src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true"
         alt="Concertación Carabobo" />
    <div class="brand-text">
      <span>Concertación Carabobo</span>
      <span>Mapa Electoral Estratégico</span>
    </div>
  </div>
  <div class="header-stat">
    <span class="val">1.663.942</span>
    <span class="lbl">Electores en Carabobo</span>
  </div>
</header>
 
<!-- ── APP ────────────────────────────────────────────────────── -->
<div id="app">
  <div id="map"></div>
</div>
 
<!-- ── SIDE PANEL ─────────────────────────────────────────────── -->
<div id="panel">
  <button id="panel-close" title="Cerrar">✕</button>
 
  <div id="panel-hero">
    <img id="panel-flag" src="" alt="Bandera del municipio" />
    <div id="panel-name">—</div>
    <div id="panel-capital">Capital: —</div>
  </div>
 
  <div id="panel-stats">
    <div class="stat-card">
      <span class="s-icon">🗳️</span>
      <span class="s-val" id="stat-mesas">—</span>
      <span class="s-lbl">Mesas</span>
    </div>
    <div class="stat-card">
      <span class="s-icon">👥</span>
      <span class="s-val" id="stat-electores">—</span>
      <span class="s-lbl">Electores</span>
    </div>
    <div class="stat-card">
      <span class="s-icon">📊</span>
      <span class="s-val" id="stat-pct">—</span>
      <span class="s-lbl">% del Estado</span>
    </div>
    <div class="stat-card">
      <span class="s-icon">🏛️</span>
      <span class="s-val" id="stat-ratio">—</span>
      <span class="s-lbl">Electores/Mesa</span>
    </div>
  </div>
 
  <div id="panel-footer">
    <img src="https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/logo_concertacion_carabobo-removebg-preview.png?raw=true"
         alt="Logo" />
    <span>Concertación Carabobo · 2025</span>
  </div>
</div>
 
<!-- ── HINT ───────────────────────────────────────────────────── -->
<div id="hint">Haz clic en un municipio para ver su información</div>
 
<!-- ── LEAFLET JS ──────────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
<script>
/* ════════════════════════════════════════════════════════════════
   DATOS DE MUNICIPIOS
═══════════════════════════════════════════════════════════════ */
const MUNICIPIOS = {
  "Valencia":      { capital: "Valencia",     mesas: 742,  electores: 613670,  flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Valencia.jpg?raw=true" },
  "Diego Ibarra":  { capital: "Mariara",      mesas: 90,   electores: 71951,   flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Diego%20Ibarra.jpg?raw=true" },
  "Carlos Arvelo": { capital: "Güigüe",       mesas: 147,  electores: 107312,  flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/carlos%20arvelo.jpg?raw=true" },
  "Guacara":       { capital: "Guacara",      mesas: 153,  electores: 131072,  flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Guacara.jpg?raw=true" },
  "Juan José Mora":{ capital: "Morón",        mesas: 78,   electores: 53965,   flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Juan%20Jose%20Mora.jpg?raw=true" },
  "Libertador":    { capital: "Tocuyito",     mesas: 159,  electores: 124901,  flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Libertador.jpg?raw=true" },
  "Los Guayos":    { capital: "Los Guayos",   mesas: 131,  electores: 106124,  flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Los%20Guayos.jpg?raw=true" },
  "Miranda":       { capital: "Miranda",      mesas: 31,   electores: 22578,   flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Miranda.jpg?raw=true" },
  "Montalbán":     { capital: "Montalbán",    mesas: 24,   electores: 19238,   flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Montalban.jpg?raw=true" },
  "Naguanagua":    { capital: "Naguanagua",   mesas: 127,  electores: 106869,  flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Naguanagua.jpg?raw=true" },
  "Puerto Cabello":{ capital: "Puerto Cabello",mesas: 188, electores: 150415,  flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Puerto%20Cabello.jpg?raw=true" },
  "San Diego":     { capital: "San Diego",    mesas: 81,   electores: 72497,   flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/San%20diego.jpg?raw=true" },
  "San Joaquín":   { capital: "San Joaquín",  mesas: 56,   electores: 45866,   flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/San%20Joaquin.jpg?raw=true" },
  "Bejuma":        { capital: "Bejuma",       mesas: 52,   electores: 37484,   flag: "https://github.com/jhonmalorne/concertacionCaraboboMapaElectoral/blob/main/Bejuma.jpg?raw=true" },
};
 
/* Totales del estado (para calcular % */
const TOTAL_ELECTORES = 1663942;
const TOTAL_MESAS     = 2059;
 
/* ════════════════════════════════════════════════════════════════
   COLORES
═══════════════════════════════════════════════════════════════ */
const COLOR_NORMAL   = '#1a3a8f';
const COLOR_HOVER    = '#2255c8';
const COLOR_SELECTED = '#1b8a4c';
const COLOR_DIM      = '#07163a';
const OPACITY_NORMAL = 0.55;
const OPACITY_DIM    = 0.25;
 
/* ════════════════════════════════════════════════════════════════
   INICIALIZAR MAPA
═══════════════════════════════════════════════════════════════ */
const map = L.map('map', {
  center: [10.18, -68.0],
  zoom: 9,
  zoomControl: true,
  attributionControl: false,
});
 
/* Tile oscuro */
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);
 
/* Reposicionar zoom */
map.zoomControl.setPosition('topright');
 
/* ════════════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════════ */
function fmt(n) {
  return n.toLocaleString('es-VE');
}
 
/** Normaliza nombre para buscar en el diccionario */
function matchMunicipio(rawName) {
  if (!rawName) return null;
  const name = rawName.trim();
  // Búsqueda exacta primero
  if (MUNICIPIOS[name]) return name;
  // Búsqueda parcial
  const lower = name.toLowerCase();
  for (const key of Object.keys(MUNICIPIOS)) {
    if (lower.includes(key.toLowerCase()) || key.toLowerCase().includes(lower)) return key;
  }
  return null;
}
 
/* ════════════════════════════════════════════════════════════════
   ESTADO DE INTERACCIÓN
═══════════════════════════════════════════════════════════════ */
let selectedLayer = null;
let geojsonLayer  = null;
 
/* ════════════════════════════════════════════════════════════════
   ESTILOS DE CAPAS
═══════════════════════════════════════════════════════════════ */
function styleNormal(feature) {
  return {
    color: '#27c06a',
    weight: 1.5,
    fillColor: COLOR_NORMAL,
    fillOpacity: OPACITY_NORMAL,
    opacity: 1,
  };
}
 
function styleDim() {
  return {
    color: '#1a3a8f',
    weight: 1,
    fillColor: COLOR_DIM,
    fillOpacity: OPACITY_DIM,
    opacity: .4,
  };
}
 
function styleSelected() {
  return {
    color: '#27c06a',
    weight: 2.5,
    fillColor: COLOR_SELECTED,
    fillOpacity: 0.7,
    opacity: 1,
  };
}
 
/* ════════════════════════════════════════════════════════════════
   PANEL LATERAL
═══════════════════════════════════════════════════════════════ */
const panel     = document.getElementById('panel');
const hint      = document.getElementById('hint');
let hintHidden  = false;
 
function openPanel(key) {
  const d = MUNICIPIOS[key];
  if (!d) return;
 
  document.getElementById('panel-flag').src     = d.flag;
  document.getElementById('panel-name').textContent    = key;
  document.getElementById('panel-capital').textContent = 'Capital: ' + d.capital;
  document.getElementById('stat-mesas').textContent    = fmt(d.mesas);
  document.getElementById('stat-electores').textContent = fmt(d.electores);
  document.getElementById('stat-pct').textContent = ((d.electores / TOTAL_ELECTORES) * 100).toFixed(1) + '%';
  document.getElementById('stat-ratio').textContent = Math.round(d.electores / d.mesas).toLocaleString('es-VE');
 
  panel.classList.add('open');
 
  if (!hintHidden) {
    hint.classList.add('hidden');
    hintHidden = true;
  }
}
 
function closePanel() {
  panel.classList.remove('open');
  // Restablecer todos los polígonos
  if (geojsonLayer) {
    geojsonLayer.eachLayer(l => l.setStyle(styleNormal(l.feature)));
  }
  selectedLayer = null;
}
 
document.getElementById('panel-close').addEventListener('click', closePanel);
 
/* ════════════════════════════════════════════════════════════════
   INTERACCIONES DE CAPA
═══════════════════════════════════════════════════════════════ */
function onEachFeature(feature, layer) {
  /* Tooltip */
  const rawName = feature.properties.NAME_2 || feature.properties.name || '';
  const key = matchMunicipio(rawName) || rawName;
 
  layer.bindTooltip(key, {
    className: 'map-tooltip',
    sticky: true,
    offset: [12, 0],
  });
 
  /* Hover */
  layer.on('mouseover', function () {
    if (this === selectedLayer) return;
    this.setStyle({
      fillColor: COLOR_HOVER,
      fillOpacity: 0.75,
      weight: 2,
      color: '#5b9fff',
    });
    this.bringToFront();
  });
 
  layer.on('mouseout', function () {
    if (this === selectedLayer) return;
    if (selectedLayer) {
      this.setStyle(styleDim());
    } else {
      this.setStyle(styleNormal(this.feature));
    }
  });
 
  /* Click */
  layer.on('click', function () {
    // Restablecer anterior seleccionado
    if (selectedLayer && selectedLayer !== this) {
      selectedLayer.setStyle(styleDim());
    }
 
    selectedLayer = this;
 
    // Dim todos
    geojsonLayer.eachLayer(l => {
      if (l !== selectedLayer) l.setStyle(styleDim());
    });
 
    // Resaltar seleccionado
    selectedLayer.setStyle(styleSelected());
    selectedLayer.bringToFront();
 
    // Zoom
    map.fitBounds(selectedLayer.getBounds(), { padding: [40, 40], maxZoom: 12 });
 
    // Panel
    const matchedKey = matchMunicipio(rawName);
    if (matchedKey) openPanel(matchedKey);
  });
}
 
/* ════════════════════════════════════════════════════════════════
   CARGA DEL GEOJSON
   El archivo ven_admin2.json debe estar en el mismo directorio.
   Si no existe, generamos polígonos aproximados de demostración.
═══════════════════════════════════════════════════════════════ */
fetch('ven_admin2.json')
  .then(r => {
    if (!r.ok) throw new Error('GeoJSON no disponible');
    return r.json();
  })
  .then(data => {
    // Filtrar solo Carabobo (ADM1 name)
    const caraboboFeatures = data.features.filter(f => {
      const adm1 = (f.properties.NAME_1 || f.properties.adm1 || '').toLowerCase();
      return adm1.includes('carabobo');
    });
 
    const filtered = { type: 'FeatureCollection', features: caraboboFeatures };
 
    geojsonLayer = L.geoJSON(filtered, {
      style: styleNormal,
      onEachFeature,
    }).addTo(map);
 
    map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
    hideLoader();
  })
  .catch(() => {
    // Fallback: polígonos aproximados embebidos para demostración
    loadFallbackPolygons();
  });
 
/* ════════════════════════════════════════════════════════════════
   FALLBACK CON COORDENADAS APROXIMADAS
   (se usa si ven_admin2.json no está disponible)
═══════════════════════════════════════════════════════════════ */

      { type:"Feature", properties:{ NAME_2:"Bejuma" },         geometry:{ type:"Polygon", coordinates:[[[-68.30,10.04],[-68.17,10.04],[-68.17,10.18],[-68.30,10.18],[-68.30,10.04]]] } },

  const warn = L.control({ position: 'bottomleft' });

/* ════════════════════════════════════════════════════════════════
   LOADER
═══════════════════════════════════════════════════════════════ */
function hideLoader() {
  setTimeout(() => {
    document.getElementById('loader').classList.add('done');
    setTimeout(() => document.getElementById('loader').remove(), 600);
  }, 400);
}
 
/* ════════════════════════════════════════════════════════════════
   CERRAR PANEL AL CLICK EN MAPA (fuera de polígono)
═══════════════════════════════════════════════════════════════ */
map.on('click', function (e) {
  // Si el click fue fuera de cualquier polígono
  if (!e.originalEvent._featureClicked) {
    closePanel();
  }
});
 
// Marcar que el click fue en un feature (para distinguirlo del click en el mapa)
document.addEventListener('DOMContentLoaded', () => {}, false);
</script>
