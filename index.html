<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Concertación Carabobo | Mapa Electoral (Depuración incluida)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; }
        .header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(10, 35, 65, 0.92); backdrop-filter: blur(12px);
            padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .logo-concertacion { height: 48px; }
        .title { color: white; font-weight: 600; background: linear-gradient(135deg, #FFF, #B8E1FC); background-clip: text; -webkit-background-clip: text; color: transparent; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .sidebar {
            position: absolute; top: 85px; right: 20px; bottom: 20px; width: 360px;
            background: rgba(255,255,255,0.98); border-radius: 28px; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.35);
            z-index: 1000; overflow-y: auto; transition: transform 0.3s; font-family: 'Inter', sans-serif;
        }
        .sidebar.hidden { transform: translateX(420px); pointer-events: none; }
        .sidebar-content { padding: 1.5rem; }
        .close-sidebar {
            position: absolute; top: 18px; right: 20px; background: #eef2f5; border: none;
            width: 32px; height: 32px; border-radius: 40px; cursor: pointer; font-weight: bold;
        }
        .stat-card { background: #f8fafd; border-radius: 20px; padding: 0.8rem; margin: 1rem 0; display: flex; justify-content: space-between; }
        .parishes-list { background: white; border-radius: 24px; padding: 0.8rem; max-height: 200px; overflow-y: auto; margin: 1rem 0; }
        .loader {
            position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white;
            padding: 8px 16px; border-radius: 40px; z-index: 1200; font-size: 13px;
        }
        .error-banner {
            position: absolute; top: 80px; left: 20px; right: 20px; background: #dc2626; color: white;
            padding: 12px; border-radius: 16px; z-index: 1100; text-align: center; font-weight: 500;
        }
        @media (max-width: 700px) { .sidebar { width: 85%; } }
    </style>
</head>
<body>
<div class="header">
    <div class="logo-container">
        <img class="logo-concertacion" src="https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/logo_conconcertacion_carabobo-removebg-preview.png" alt="Concertación">
        <span class="title">Concertación Carabobo · Estrategia Electoral</span>
    </div>
</div>
<div id="map"></div>
<div id="sidebarPanel" class="sidebar hidden">
    <button class="close-sidebar" id="closeSidebarBtn">✕</button>
    <div class="sidebar-content" id="sidebarDynamic">Selecciona un municipio</div>
</div>
<div class="loader" id="loaderMsg">Cargando datos geográficos...</div>

<script>
    // ======================= CONFIGURACIÓN =======================
    const MUNI_URL = "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/20fa810cbe0cf9a47bf6ea735241492e515fd0b6/ven_admin2.json";
    const PARROQ_URL = "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/2bcdf9a99688ba0458d1796b8465dcb0d2f42b61/parroquias_carabobo.geojson.json";
    
    // Datos electorales (proporcionados por ti)
    const electoralData = {
        "Valencia": { mesas: 742, electores: 613670, capital: "Valencia", centro: [10.153985, -67.988735] },
        "Diego Ibarra": { mesas: 90, electores: 71951, capital: "Mariara", centro: [10.288812, -67.721095] },
        "Carlos Arvelo": { mesas: 147, electores: 107312, capital: "Güigüe", centro: [10.083036, -67.780881] },
        "Guacara": { mesas: 153, electores: 131072, capital: "Guacara", centro: [10.263974, -67.890448] },
        "Juan José Mora": { mesas: 78, electores: 53965, capital: "Morón", centro: [10.491015, -68.198705] },
        "Libertador": { mesas: 159, electores: 124901, capital: "Tocuyito", centro: [10.015869, -68.154266] },
        "Los Guayos": { mesas: 131, electores: 106124, capital: "Los Guayos", centro: [10.172879, -67.925227] },
        "Miranda": { mesas: 31, electores: 22578, capital: "Miranda", centro: [10.149892, -68.401530] },
        "Montalbán": { mesas: 24, electores: 19238, capital: "Montalbán", centro: [10.213548, -68.325858] },
        "Naguanagua": { mesas: 127, electores: 106869, capital: "Naguanagua", centro: [10.268467, -68.015500] },
        "Puerto Cabello": { mesas: 188, electores: 150415, capital: "Puerto Cabello", centro: [10.471149, -68.024911] },
        "San Diego": { mesas: 81, electores: 72497, capital: "San Diego", centro: [10.258939, -67.963485] },
        "San Joaquín": { mesas: 56, electores: 45866, capital: "San Joaquín", centro: [10.259778, -67.801935] },
        "Bejuma": { mesas: 52, electores: 37484, capital: "Bejuma", centro: [10.176950, -68.259151] }
    };
    
    const flagUrls = {
        "Valencia": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Valencia.jpg",
        "Diego Ibarra": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Diego%20Ibarra.jpg",
        "Carlos Arvelo": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/carlos%20arvelo.jpg",
        "Guacara": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Guacara.jpg",
        "Juan José Mora": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Juan%20Jose%20Mora.jpg",
        "Libertador": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Libertador.jpg",
        "Los Guayos": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Los%20Guayos.jpg",
        "Miranda": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Miranda.jpg",
        "Montalbán": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Montalban.jpg",
        "Naguanagua": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Naguanagua.jpg",
        "Puerto Cabello": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Puerto%20Cabello.jpg",
        "San Diego": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/San%20diego.jpg",
        "San Joaquín": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/San%20Joaquin.jpg",
        "Bejuma": "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/Bejuma.jpg"
    };
    const LOGO_URL = "https://raw.githubusercontent.com/jhonmalorne/concertacionCaraboboMapaElectoral/main/logo_conconcertacion_carabobo-removebg-preview.png";
    
    // ======================= INICIALIZAR MAPA =======================
    const map = L.map('map').setView([10.18, -68.05], 10);
    const street = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap' });
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });
    street.addTo(map);
    L.control.layers({ "Vista Mapa": street, "Satelital": satellite }).addTo(map);
    
    let municipiosLayer = null, parroquiasLayer = null;
    let parishByMunicipio = new Map();
    let currentMunId = null;
    const sidebar = document.getElementById('sidebarPanel');
    const sidebarContent = document.getElementById('sidebarDynamic');
    document.getElementById('closeSidebarBtn').addEventListener('click', () => sidebar.classList.add('hidden'));
    
    function showError(msg) {
        const loaderDiv = document.getElementById('loaderMsg');
        loaderDiv.innerHTML = `⚠️ ${msg}`;
        loaderDiv.style.background = "#b91c1c";
        console.error(msg);
        // Mostrar banner adicional
        if (!document.querySelector('.error-banner')) {
            const banner = document.createElement('div');
            banner.className = 'error-banner';
            banner.innerHTML = msg + ' - Revisa consola (F12)';
            document.body.prepend(banner);
        }
    }
    
    // Inteligencia para extraer nombre del municipio de cualquier propiedad
    function getMunicipioName(props) {
        const candidates = ['ADM2_NAME', 'NAME_2', 'MPIO_NOMBRE', 'NOMBRE_MUN', 'municipio', 'name'];
        for (let c of candidates) if (props[c]) return props[c];
        return null;
    }
    
    function getParroquiaName(props) {
        const candidates = ['ADM3_NAME', 'NAME_3', 'PARROQUIA', 'NOMBRE_PARROQ', 'parroquia'];
        for (let c of candidates) if (props[c]) return props[c];
        return null;
    }
    
    function getParentMunicipioFromParroquia(props) {
        const candidates = ['ADM2_NAME', 'NAME_2', 'MPIO_NOMBRE', 'municipio', 'MUNICIPIO'];
        for (let c of candidates) if (props[c]) return props[c];
        return null;
    }
    
    // ======================= CARGAR GEOJSON =======================
    async function loadData() {
        try {
            const [munRes, parRes] = await Promise.all([fetch(MUNI_URL), fetch(PARROQ_URL)]);
            if (!munRes.ok) throw new Error(`Municipios HTTP ${munRes.status}`);
            if (!parRes.ok) throw new Error(`Parroquias HTTP ${parRes.status}`);
            
            const municipiosJson = await munRes.json();
            const parroquiasJson = await parRes.json();
            
            console.log("✅ GeoJSON cargados", municipiosJson.features.length, parroquiasJson.features.length);
            console.log("Ejemplo propiedades municipio:", municipiosJson.features[0]?.properties);
            console.log("Ejemplo propiedades parroquia:", parroquiasJson.features[0]?.properties);
            
            // Filtrar solo Carabobo (detectar campo de estado)
            let caraboboMunis = municipiosJson.features.filter(f => {
                const props = f.properties;
                const estado = props.ADM1_NAME || props.NAME_1 || props.ESTADO || '';
                return estado.toLowerCase().includes('carabobo');
            });
            if (caraboboMunis.length === 0) {
                // fallback: si no encuentra, toma los primeros 14 sospechosos (pero muestra advertencia)
                console.warn("No se detectó Carabobo, usando todos los municipios del archivo");
                caraboboMunis = municipiosJson.features;
            }
            console.log(`Municipios de Carabobo: ${caraboboMunis.length}`);
            
            // Crear capa municipios
            municipiosLayer = L.geoJSON({ type: "FeatureCollection", features: caraboboMunis }, {
                style: { fillColor: '#3b82b6', color: '#fff', weight: 1.2, fillOpacity: 0.6 },
                onEachFeature: (feature, layer) => {
                    const munName = getMunicipioName(feature.properties);
                    if (!munName) return;
                    // Hover
                    layer.on('mouseover', () => {
                        if (currentMunId === munName) return;
                        layer.setStyle({ weight: 3, color: '#ffcd94', fillOpacity: 0.8 });
                    });
                    layer.on('mouseout', () => {
                        if (currentMunId === munName) return;
                        layer.setStyle({ weight: 1.2, color: '#fff', fillOpacity: 0.6 });
                    });
                    layer.on('click', () => {
                        // Resaltar municipio y oscurecer otros
                        if (currentMunId === munName) return;
                        currentMunId = munName;
                        municipiosLayer.eachLayer(l => {
                            const name = getMunicipioName(l.feature.properties);
                            if (name === munName) l.setStyle({ fillColor: '#f4a261', weight: 3, fillOpacity: 0.85 });
                            else l.setStyle({ fillColor: '#6c757d', fillOpacity: 0.25, weight: 1 });
                        });
                        // Resaltar parroquias
                        if (parroquiasLayer) {
                            parroquiasLayer.eachLayer(layerP => {
                                const parentMun = getParentMunicipioFromParroquia(layerP.feature.properties);
                                if (parentMun && parentMun.toLowerCase() === munName.toLowerCase()) {
                                    layerP.setStyle({ fillColor: '#ffb347', weight: 2.5, fillOpacity: 0.85 });
                                } else {
                                    layerP.setStyle({ fillColor: '#4a5d6c', fillOpacity: 0.2, weight: 0.8 });
                                }
                            });
                        }
                        // Actualizar sidebar
                        updateSidebar(munName);
                        map.fitBounds(layer.getBounds(), { padding: [40,40] });
                    });
                }
            }).addTo(map);
            
            // Capa de parroquias
            parroquiasLayer = L.geoJSON(parroquiasJson, {
                style: { fillColor: '#2c6e49', color: '#cfe6cf', weight: 1, fillOpacity: 0.4 },
                onEachFeature: (feature, layer) => {
                    const parrName = getParroquiaName(feature.properties);
                    const munParent = getParentMunicipioFromParroquia(feature.properties);
                    if (munParent) {
                        if (!parishByMunicipio.has(munParent)) parishByMunicipio.set(munParent, []);
                        const list = parishByMunicipio.get(munParent);
                        if (parrName && !list.includes(parrName)) list.push(parrName);
                    }
                }
            }).addTo(map);
            
            // Ordenar listas de parroquias
            for (let [k, v] of parishByMunicipio.entries()) parishByMunicipio.set(k, v.sort());
            
            // Asegurar que todos los municipios tengan al menos lista vacía
            Object.keys(electoralData).forEach(mun => {
                if (!parishByMunicipio.has(mun)) parishByMunicipio.set(mun, []);
            });
            
            document.getElementById('loaderMsg').style.display = 'none';
            // Ajustar vista a Carabobo
            if (municipiosLayer.getBounds().isValid()) map.fitBounds(municipiosLayer.getBounds(), { padding: [30,30] });
            
            // Click en mapa vacío: resetear todo
            map.on('click', (e) => {
                if (currentMunId) {
                    resetMapStyles();
                    currentMunId = null;
                    sidebar.classList.add('hidden');
                }
            });
            
        } catch (err) {
            showError(`Error crítico: ${err.message}. Verifica las URLs y CORS.`);
            console.error(err);
        }
    }
    
    function resetMapStyles() {
        if (municipiosLayer) {
            municipiosLayer.eachLayer(l => l.setStyle({ fillColor: '#3b82b6', fillOpacity: 0.6, weight: 1.2, color: '#fff' }));
        }
        if (parroquiasLayer) {
            parroquiasLayer.eachLayer(l => l.setStyle({ fillColor: '#2c6e49', fillOpacity: 0.4, weight: 1, color: '#cfe6cf' }));
        }
    }
    
    function updateSidebar(munName) {
        const data = electoralData[munName];
        if (!data) {
            sidebarContent.innerHTML = `<div style="color:red;">Datos electorales no encontrados para ${munName}</div>`;
            sidebar.classList.remove('hidden');
            return;
        }
        const flag = flagUrls[munName] || '';
        const parishes = parishByMunicipio.get(munName) || [];
        const html = `
            <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1rem;">
                ${flag ? `<img src="${flag}" style="width:65px; height:45px; object-fit:cover; border-radius:12px;">` : ''}
                <h2 style="color:#0a2b3e;">${munName}</h2>
            </div>
            <div style="background:#eef3fc; display:inline-block; padding:4px 12px; border-radius:40px;">🏛️ Capital: ${data.capital}</div>
            <div class="stat-card"><span>🗳️ Mesas</span><strong>${data.mesas.toLocaleString()}</strong></div>
            <div class="stat-card"><span>👥 Electores</span><strong>${data.electores.toLocaleString()}</strong></div>
            <div class="parishes-list"><h4>📌 Parroquias (${parishes.length})</h4>${parishes.map(p => `<div>📍 ${p}</div>`).join('') || '<div>No se encontraron parroquias asociadas</div>'}</div>
            <div style="display:flex; justify-content:center; margin-top:1rem;"><img src="${LOGO_URL}" style="height:50px;"></div>
        `;
        sidebarContent.innerHTML = html;
        sidebar.classList.remove('hidden');
    }
    
    loadData();
</script>
</body>
</html>
